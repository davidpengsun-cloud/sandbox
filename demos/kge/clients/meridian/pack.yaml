# -- 1.1.0: the query semantics of the Wealth expansion (meta-model 1.1.0) -------------------------------------------------
# What a figure the Wealth terms name is built of, as data: a term resolves to its contexts; a context names its measure
# and fact table, the filters and row selectors it always applies, and the declared joins it renders, always or to reach a
# dimension. A runtime builds the query from these, not from the question's words.

# Short forms: of a term, or as the physical columns' names would spell them (the cryptic spellings a question may use).
acronyms:
  - {id: NNA, expansion: Net New Assets, terms: [net-new-assets]}
  - {id: AUA, expansion: Assets Under Advice, terms: [assets-under-advice]}
  - {id: AUM, expansion: Assets Under Management, terms: [assets-under-management]}
  - {id: NNA_ELIG_FLG, expansion: NNA eligible flag, terms: [nna-eligibility], columns: [wealth.TRAN_FACT_1.NNA_IN]}
  - id: SRC_SYS_CD
    expansion: source system code
    terms: [source-system]
    columns: [wealth.TRAN_FACT_1.ACCT_SRCE_SYS_ID, wealth.ACCT_DIM2_1.SRCE_SYS_ID, wealth.NNA_EXCL_1.SRCE_SYS_CD,
              xref.client_xref.source_system]
  - {id: CLNT_DIR_IND, expansion: client-directed indicator, columns: [wealth.F_NNA_FIN.CLIENT_DIRECTED_NNA_IN]}
  # SAGE's physical column names, as the columns spell them (1.5.0): an acronym the column's name is.
  - {id: ACCT_SRCE_SYS_ID, expansion: Account source system id, columns: [wealth.TRAN_FACT_1.ACCT_SRCE_SYS_ID]}
  - {id: BRCH_CD, expansion: Branch code, columns: [wealth.BRCH_DIM_1.BRCH_CD]}
  - {id: BRCH_NM, expansion: Branch name, columns: [wealth.BRCH_DIM_1.BRCH_NM]}
  - {id: CLDR_EOM_DT, expansion: Calendar eom date, columns: [wealth.MONTH_DIM_1.CLDR_EOM_DT]}
  - {id: CURR_IN, expansion: Current indicator, columns: [wealth.ACCT_DIM2_1.CURR_IN, wealth.TRAN_FACT_1.CURR_IN, wealth.BRCH_DIM_1.CURR_IN]}
  - {id: DW_ACCT_ID, expansion: DW account id, columns: [wealth.ACCT_DIM2_1.DW_ACCT_ID, wealth.TRAN_FACT_1.DW_ACCT_ID]}
  - {id: DW_EFF_DT, expansion: DW effective date, columns: [wealth.ACCT_DIM2_1.DW_EFF_DT, wealth.TRAN_FACT_1.DW_EFF_DT, wealth.BRCH_DIM_1.DW_EFF_DT]}
  - {id: DW_EXPR_DT, expansion: DW expiry date, columns: [wealth.ACCT_DIM2_1.DW_EXPR_DT, wealth.TRAN_FACT_1.DW_EXPR_DT, wealth.BRCH_DIM_1.DW_EXPR_DT]}
  - {id: DW_TRAN_DT, expansion: DW transaction date, columns: [wealth.TRAN_FACT_1.DW_TRAN_DT]}
  - {id: DW_TRAN_ID, expansion: DW transaction id, columns: [wealth.TRAN_FACT_1.DW_TRAN_ID]}
  - {id: DW_TRAN_TYPE_CD, expansion: DW transaction type code, columns: [wealth.TRAN_FACT_1.DW_TRAN_TYPE_CD]}
  - {id: FIN_MTRC_RLSE_DT, expansion: Financial metric release date, columns: [wealth.MONTH_DIM_1.FIN_MTRC_RLSE_DT]}
  - {id: HSHLD_DK, expansion: Household key, columns: [wealth.ACCT_DIM2_1.HSHLD_DK]}
  - {id: NNA_IN, expansion: Net new assets indicator, columns: [wealth.TRAN_FACT_1.NNA_IN]}
  - {id: OFSET_ACCT_ID, expansion: Offset account id, columns: [wealth.TRAN_FACT_1.OFSET_ACCT_ID]}
  - {id: RGN_CD, expansion: Region code, columns: [wealth.BRCH_DIM_1.RGN_CD]}
  - {id: SRCE_SYS_ID, expansion: Source system id, columns: [wealth.ACCT_DIM2_1.SRCE_SYS_ID, wealth.SRCE_SYS_1.SRCE_SYS_ID]}
  - {id: SRCE_SYS_NM, expansion: Source system name, columns: [wealth.SRCE_SYS_1.SRCE_SYS_NM]}
  - {id: TEST_ACCT_IN, expansion: Test account indicator, columns: [wealth.ACCT_DIM2_1.TEST_ACCT_IN]}
  - {id: TRAN_AM, expansion: Transaction amount, columns: [wealth.TRAN_FACT_1.TRAN_AM]}

# Business entities and the key a table identifies each by: each unit's customer, by its customer-like key, and the
# Wealth account, by its composite key (an account number is unique only within its source system), SAGE's ACCT_DIM2_1
# since 1.5.0. Since 1.5.0 every Wealth table represents the entity its business name names (kge/estate/names.py): the
# Wealth household and account as before, the rest labelled with the name, so a person or an agent reads the table by it.
entities:
  - {id: retail_customer, label: Retail customer, table: retail.customer, key: [customer_id]}
  - {id: sme_client, label: SME client, table: sme.client, key: [client_no]}
  - {id: corporate_counterparty, label: Corporate counterparty, table: corporate.counterparty, key: [counterparty_ref]}
  - {id: wealth_household, label: Wealth household, table: wealth.HSHLD_DIM_1, key: [HSHLD_DK]}
  - {id: wealth_account, label: Wealth account, table: wealth.ACCT_DIM2_1, key: [DW_ACCT_ID, SRCE_SYS_ID]}
  # Each other Wealth table, by its business name (1.5.0): its label is the name, the table its physical one.
  - {id: wealth_fiscal_calendar, label: fiscal_calendar, table: wealth.FISCAL_QTR_DIM_1, key: [FISCAL_QTR_CD]}
  - {id: wealth_advisor, label: advisor, table: wealth.ADV_DIM_1, key: [ADV_ID]}
  - {id: wealth_portfolio, label: portfolio, table: wealth.PRTFL_DIM_1, key: [PRTFL_ID]}
  - {id: wealth_holding, label: holding, table: wealth.HLDG_FACT_1, key: [HLDG_ID]}
  - {id: wealth_quarterly_fee_revenue, label: quarterly_fee_revenue, table: wealth.QTR_FEE_REV_FACT_1, key: [FEE_ID]}
  - {id: wealth_assets_under_advice, label: assets_under_advice, table: wealth.AUA_FACT_1, key: [AUA_ID]}
  - {id: wealth_suitability_review, label: suitability_review, table: wealth.SUIT_RVW_FACT_1, key: [RVW_ID]}
  - {id: wealth_division, label: division, table: wealth.DIVSN_DIM_1, key: [DIVSN_CD]}
  - {id: wealth_region, label: region, table: wealth.RGN_DIM_1, key: [RGN_CD]}
  - {id: wealth_client_segment, label: client_segment, table: wealth.CLNT_SEGMT_DIM_1, key: [SEGMT_CD]}
  - {id: wealth_ref_flow_type, label: ref_flow_type, table: wealth.TRAN_TYPE_1, key: [DW_TRAN_TYPE_CD]}
  - {id: wealth_household_member, label: household_member, table: wealth.HSHLD_MBR_1, key: [HSHLD_DK, MBR_ID]}
  - {id: wealth_nna_exclusion, label: nna_exclusion, table: wealth.NNA_EXCL_1, key: [EXCL_ID]}
  - {id: wealth_aum_month_end, label: aum_month_end, table: wealth.AUM_MNTH_END_FACT_1, key: [HSHLD_DK, CLDR_EOM_DT]}
  - {id: wealth_flow, label: flow, table: wealth.TRAN_FACT_1, key: [DW_TRAN_ID]}
  - {id: wealth_month_end, label: month_end, table: wealth.MONTH_DIM_1, key: [CLDR_EOM_DT]}
  - {id: wealth_office, label: office, table: wealth.BRCH_DIM_1, key: [BRCH_CD]}
  - {id: wealth_ref_source_system, label: ref_source_system, table: wealth.SRCE_SYS_1, key: [SRCE_SYS_ID]}
  - {id: wealth_client_code_rollup, label: client_code_rollup, table: wealth.CLIENT_CD_ROLLUP_1, key: [CLNT_CD]}
  - {id: wealth_calendar_date, label: calendar_date, table: wealth.DATE_DIM_1, key: [CALENDAR_DATE]}
  - {id: wealth_flow_excl_mf_clearing, label: flow_excl_mf_clearing, table: wealth.TRAN_FACT_EXCL_MFCLR_G, key: [DW_TRAN_ID]}
  - {id: wealth_nna_reference, label: nna_reference, table: wealth.F_NNA_FIN, key: [DW_TRAN_ID]}
  - {id: wealth_bank_deposit_account, label: bank_deposit_account, table: wealth.BANK_DEP_ACCT_ADDR_1, key: [DW_BANK_ACCT_ID]}
  - {id: wealth_brokerage_account_detail, label: brokerage_account_detail, table: wealth.LGCY_ACCT_1, key: [ACCT_ID]}
  - {id: wealth_account_segment, label: account_segment, table: wealth.D_ACCT_SEGMT, key: [DW_ACCT_SEGMT_ID]}
  - {id: wealth_account_segment_enrollment, label: account_segment_enrollment, table: wealth.F_ACCT_SEGMT_ENRLMT, key: [DW_ACCT_ID, SRCE_SYS_ID, DW_ACCT_SEGMT_ID, ACCT_ENRLMT_EFF_DT]}
  - {id: wealth_core_offer, label: core_offer, table: wealth.D_CORE_OFFER, key: [CORE_OFFER_DK]}
  - {id: wealth_core_offer_enrollment, label: core_offer_enrollment, table: wealth.CORE_OFFER_ENRLMT_1, key: [OFFER_ORDER_ID]}
  - {id: wealth_insurance_contract, label: insurance_contract, table: wealth.INS_CONTR_1, key: [CONTR_ID]}
  - {id: wealth_insurance_product, label: insurance_product, table: wealth.INS_SEC_PROD_CD_1, key: [CUSIP_ID]}

# The relation the certified cross-reference implements (joins: client_xref).
relations:
  - {id: same_client, label: Same client, from: retail_customer, to: wealth_household}

# Lineage: assets under management at each quarter end is the households' holdings at market value, summed.
lineage:
  - table: wealth.AUM_MNTH_END_FACT_1
    derived_from: [wealth.HLDG_FACT_1]
    note: the market value of each household's holdings, summed at each quarter end

# Standing conditions on one table's rows. eligible conflicts with not_excluded: a flow can be eligible and its account
# excluded on the day, and then the exclusion wins. SAGE's indicators are Y or N. A month is released once it is no longer
# SAGE's open brokerage month (DW_BRKRG_MNTH_FRM_TODAY_CT, 0 for the open month). Whether a client directed a flow is
# SAGE's net new assets extract's (F_NNA_FIN.CLIENT_DIRECTED_NNA_IN), by the flow's id.
filters:
  - {id: eligible, label: Eligible for net new assets, table: wealth.TRAN_FACT_1, predicate: TRAN_FACT_1.NNA_IN = 'Y',
     conflicts_with: [not_excluded]}
  - {id: released, label: Released months only, table: wealth.MONTH_DIM_1, predicate: MONTH_DIM_1.DW_BRKRG_MNTH_FRM_TODAY_CT <> 0}
  - {id: client_directed, label: Flows the client instructed, table: wealth.F_NNA_FIN, predicate: F_NNA_FIN.CLIENT_DIRECTED_NNA_IN = 'Y'}

# A fact row is left out when a row of the selector's table matches it (NOT EXISTS): a test account's flows, and the flows
# of an account excluded on the flow's date (the exclusion is effective-dated; an open one has no end). One on another
# unit's table selects that unit's side of the certified join instead, only when a question reaches it. An exclusion
# names an account by Meridian's source system code, BANK or BROKERAGE, which the selector decodes from SAGE's id, 200 or 100.
row_selectors:
  - id: not_test_account
    label: Not on a test account
    table: wealth.ACCT_DIM2_1
    mode: exclude
    predicate: >-
      ACCT_DIM2_1.DW_ACCT_ID = TRAN_FACT_1.DW_ACCT_ID AND ACCT_DIM2_1.SRCE_SYS_ID = TRAN_FACT_1.ACCT_SRCE_SYS_ID AND
      ACCT_DIM2_1.TEST_ACCT_IN = 'Y'
  - id: not_excluded
    label: Not on an account excluded on the day
    table: wealth.NNA_EXCL_1
    mode: exclude
    predicate: >-
      NNA_EXCL_1.DW_ACCT_ID = TRAN_FACT_1.DW_ACCT_ID AND NNA_EXCL_1.SRCE_SYS_CD = CASE TRAN_FACT_1.ACCT_SRCE_SYS_ID
      WHEN 100 THEN 'BROKERAGE' WHEN 200 THEN 'BANK' END AND TRAN_FACT_1.DW_TRAN_DT BETWEEN NNA_EXCL_1.EXCL_EFF_DT AND
      coalesce(NNA_EXCL_1.EXCL_EXPR_DT, DATE '9999-12-31')
    conflicts_with: [eligible]
  # On Retail's side of the certified client cross-reference: a client who banks with Retail holds an open Retail account
  # (the owner's XB3). A row selector on another source's table applies only across the certified join, to its far side,
  # so a question within Wealth reads no Retail table; include keeps a match only where one of its rows matches.
  - id: banks_with_retail
    label: "Banks with Retail: an open Retail account"
    table: retail.account
    mode: include
    predicate: account.customer_id = customer.customer_id AND account.status_code = 'OPEN'

# Typed, declared joins: what the context path joins through, and nothing else. A table that keeps its history (policies:
# scd2) is joined as its version current now, or valid on the date the question's time mode gives (as reported: the
# month's freeze date); that rendering is the runtime's, from the policy. A foreign key harvested from a catalogue is only
# a candidate for one (the compiler lists those no join here covers).
joins:
  - {id: flow_month_end, kind: calendar_rollup, from: wealth.TRAN_FACT_1, to: wealth.MONTH_DIM_1,
     condition: last_day(TRAN_FACT_1.DW_TRAN_DT) = MONTH_DIM_1.CLDR_EOM_DT}
  # SAGE's month-end key (TRAN_FACT_1.MNTH_END_DT) is also a physical FK. Keep one release join for a flow: two
  # parallel calendar rollups would apply the same release rule twice to a governed preview.
  - {id: sage_account_client_code, kind: hierarchy, from: wealth.ACCT_DIM2_1, to: wealth.CLIENT_CD_ROLLUP_1,
     condition: ACCT_DIM2_1.EFF_CLNT_CD = CLIENT_CD_ROLLUP_1.CLNT_CD}
  - {id: sage_account_office, kind: hierarchy, from: wealth.ACCT_DIM2_1, to: wealth.BRCH_DIM_1,
     condition: ACCT_DIM2_1.ACCT_DOMCL_BRCH_CD = BRCH_DIM_1.BRCH_CD}
  - {id: flow_account, kind: key, from: wealth.TRAN_FACT_1, to: wealth.ACCT_DIM2_1,
     condition: TRAN_FACT_1.DW_ACCT_ID = ACCT_DIM2_1.DW_ACCT_ID AND TRAN_FACT_1.ACCT_SRCE_SYS_ID = ACCT_DIM2_1.SRCE_SYS_ID}
  - {id: account_household, kind: key, from: wealth.ACCT_DIM2_1, to: wealth.HSHLD_DIM_1, condition: ACCT_DIM2_1.HSHLD_DK = HSHLD_DIM_1.HSHLD_DK}
  - {id: household_advisor, kind: key, from: wealth.HSHLD_DIM_1, to: wealth.ADV_DIM_1,
     condition: HSHLD_DIM_1.PRIM_ADV_ID = ADV_DIM_1.ADV_ID}
  - {id: advisor_office, kind: hierarchy, from: wealth.ADV_DIM_1, to: wealth.BRCH_DIM_1, condition: ADV_DIM_1.BRCH_CD = BRCH_DIM_1.BRCH_CD}
  - {id: office_region, kind: hierarchy, from: wealth.BRCH_DIM_1, to: wealth.RGN_DIM_1, condition: BRCH_DIM_1.RGN_CD = RGN_DIM_1.RGN_CD}
  - {id: region_division, kind: hierarchy, from: wealth.RGN_DIM_1, to: wealth.DIVSN_DIM_1, condition: RGN_DIM_1.DIVSN_CD = DIVSN_DIM_1.DIVSN_CD}
  # Assets under management (1.3.0): a month end's holdings roll up to the release driver's month, and are a household's.
  - {id: aum_month_end_rollup, kind: calendar_rollup, from: wealth.AUM_MNTH_END_FACT_1, to: wealth.MONTH_DIM_1,
     condition: AUM_MNTH_END_FACT_1.CLDR_EOM_DT = MONTH_DIM_1.CLDR_EOM_DT}
  - {id: aum_household, kind: key, from: wealth.AUM_MNTH_END_FACT_1, to: wealth.HSHLD_DIM_1,
     condition: AUM_MNTH_END_FACT_1.HSHLD_DK = HSHLD_DIM_1.HSHLD_DK}
  # An account's segment is its effective client code's level 6 in SAGE's client code rollup (1.5.0).
  - {id: client_code_segment, kind: hierarchy, from: wealth.CLIENT_CD_ROLLUP_1, to: wealth.CLNT_SEGMT_DIM_1,
     condition: CLIENT_CD_ROLLUP_1.SEGMT_LVL_ID6 = CLNT_SEGMT_DIM_1.SEGMT_CD}
  - {id: segment_parent, kind: hierarchy, from: wealth.CLNT_SEGMT_DIM_1, to: wealth.CLNT_SEGMT_DIM_1, alias: parent_segment,
     condition: CLNT_SEGMT_DIM_1.PARNT_SEGMT_CD = parent_segment.SEGMT_CD}
  # Whether the client directed a flow, in SAGE's net new assets extract (1.5.0).
  - {id: flow_nna_reference, kind: key, from: wealth.TRAN_FACT_1, to: wealth.F_NNA_FIN,
     condition: TRAN_FACT_1.DW_TRAN_ID = F_NNA_FIN.DW_TRAN_ID}
  # The certified client cross-reference (Option B): a Retail customer to the Wealth household of the member who is the
  # same client, through certified matches only. Never on a date of birth or an email: matching is upstream and offline.
  - id: client_xref
    kind: cross_reference
    from: retail.customer
    to: wealth.HSHLD_DIM_1
    through: xref.client_xref
    implements: same_client
    condition: >-
      retail.customer.customer_id = xref.client_xref.retail_customer_id AND xref.client_xref.household_id =
      wealth.HSHLD_DIM_1.HSHLD_DK AND xref.client_xref.certification_status = 'CERTIFIED'

# The metric variants the Wealth terms resolve to. joins are always rendered; reaches are rendered only to group by a
# dimension or filter on an entity they lead to. golden names the golden questions that certify each, by id.
contexts:
  - id: nna
    label: Net new assets
    description: >-
      The amounts of eligible flows in released months, summed in USD, test accounts and accounts excluded on the
      flow's date left out.
    term: net-new-assets
    measure: wealth.net-new-assets
    fact: wealth.TRAN_FACT_1
    filters: [eligible, released]
    row_selectors: [not_test_account, not_excluded, banks_with_retail]
    joins: [flow_month_end]
    reaches: [flow_account, account_household, household_advisor, advisor_office, office_region, region_division,
              sage_account_client_code, client_code_segment, segment_parent, client_xref]
    golden:
      set: golden_wealth
      items: [W01, W03, W04, W05, W06, W07, W09, W10, W12, W13, W14, W15, W18, XB3, XB4]
  - id: nna_client_directed
    label: Client-directed net new assets
    description: Net new assets from the flows the client instructed.
    term: client-directed-nna
    measure: wealth.net-new-assets
    fact: wealth.TRAN_FACT_1
    filters: [eligible, released, client_directed]
    row_selectors: [not_test_account, not_excluded, banks_with_retail]
    joins: [flow_month_end, flow_nna_reference]
    reaches: [flow_account, account_household, household_advisor, advisor_office, office_region, region_division,
              sage_account_client_code, client_code_segment, segment_parent, client_xref]
    golden:
      set: golden_wealth
      items: [W02]
  - id: aum
    label: Assets under management
    description: The market value of each household's holdings at a quarter end, in released months, summed in USD.
    term: assets-under-management
    measure: wealth.assets-under-management
    fact: wealth.AUM_MNTH_END_FACT_1
    filters: [released]
    joins: [aum_month_end_rollup]
    reaches: [aum_household, household_advisor, advisor_office, office_region, region_division, client_xref]
    golden:
      set: golden_wealth
      items: [W16]

policies:
  # Personal data of customers is Restricted by default (POL-DATA-CLASS). No query the assistant plans or a model writes
  # may read these columns, in any arm: the SQL gate refuses them by name.
  restricted_attributes:
    - id: restricted-personal-data
      action: refuse
      cite: POL-DATA-CLASS
      version: 1.2.0   # 1.1.0 added the phrases people use for its columns, 1.2.0 an age and a name; the columns are 1.0.0's
      columns:
        - retail.customer.first_name
        - retail.customer.last_name
        - retail.customer.date_of_birth
        - retail.customer.email
        - corporate.contact.contact_name
        - corporate.contact.contact_email
        - wealth.HSHLD_DIM_1.HSHLD_NM
        - wealth.ACCT_DIM2_1.PRIM_TXPYR_ID
        - wealth.ACCT_DIM2_1.TXPYR_CUST_ID
        - wealth.ACCT_DIM2_1.TXPYR_CORP_CUST_ID
        - wealth.ACCT_DIM2_1.ACCT_NM
        - wealth.ACCT_DIM2_1.POSTL_CD
        - wealth.BRCH_DIM_1.EMAIL_ADDR_TX
        - wealth.BRCH_DIM_1.ADDR_LINE1_TX
        - wealth.BRCH_DIM_1.ADDR_LINE2_TX
        - wealth.BANK_DEP_ACCT_ADDR_1.MAIL_ADDR_LINE_1_TX
        - wealth.BANK_DEP_ACCT_ADDR_1.MAIL_ADDR_LINE_2_TX
        - wealth.BANK_DEP_ACCT_ADDR_1.MAIL_ADDR_LINE_3_TX
        - wealth.BANK_DEP_ACCT_ADDR_1.MAIL_ADDR_LINE_4_TX
        - wealth.BANK_DEP_ACCT_ADDR_1.MAIL_CITY_NM
        - wealth.BANK_DEP_ACCT_ADDR_1.MAIL_POSTL_CD
        - wealth.LGCY_ACCT_1.TXPYR_ID
        - wealth.LGCY_ACCT_1.TXPYR_BIRTH_DATE_TX
        - wealth.LGCY_ACCT_1.POSTL_CD
        - wealth.LGCY_ACCT_1.POSTL_PLUS_4_CD
      # What people call a column besides its name: a question that says one asks for the column, as one that names it
      # does (the parser also reads each column's own words, its initials and the acronyms that spell it). Across the
      # certified join such a question is refused, as the owner's "any cross-BU question asking for email or
      # date_of_birth" has it, however it words them. A condition on a column asks for it too (born before 1970, aged
      # over 60). A phrase asks for one column: their names are the customer's first and last name, cited by the first.
      phrases:
        - {column: retail.customer.date_of_birth, phrases: [birth, birthdate, birthday, born, age, aged, older than, younger than]}
        - {column: retail.customer.email, phrases: [e-mail]}
        - {column: retail.customer.first_name, phrases: [customer name, client name, their name]}
  # Time semantics (1.1.0). A table that keeps its history: each version holds from valid_from to valid_to, the last
  # day it holds (null, or SAGE's 9999-12-31, while it is current), and is_current marks the version that holds now
  # (SAGE's CURR_IN, 1 for the version current).
  scd2:
    - {id: scd2-wealth-account, table: wealth.ACCT_DIM2_1, valid_from: DW_EFF_DT, valid_to: DW_EXPR_DT, is_current: CURR_IN, valid_to_inclusive: true}
    - {id: scd2-wealth-flow, table: wealth.TRAN_FACT_1, valid_from: DW_EFF_DT, valid_to: DW_EXPR_DT, is_current: CURR_IN, valid_to_inclusive: true}
    - {id: scd2-wealth-office, table: wealth.BRCH_DIM_1, valid_from: DW_EFF_DT, valid_to: DW_EXPR_DT, is_current: CURR_IN, valid_to_inclusive: true}
    - {id: scd2-wealth-region, table: wealth.RGN_DIM_1, valid_from: DW_EFF_DT, valid_to: DW_EXPR_DT, is_current: CURR_IN, valid_to_inclusive: true}
    - {id: scd2-wealth-division, table: wealth.DIVSN_DIM_1, valid_from: DW_EFF_DT, valid_to: DW_EXPR_DT, is_current: CURR_IN,
       valid_to_inclusive: true}
    - {id: scd2-xref-client-xref, table: xref.client_xref, valid_from: valid_from, valid_to: valid_to, is_current: is_current,
       valid_to_inclusive: true}
  # When each month was frozen and released: only a released month is reported, and the latest month is the latest
  # released; a month as reported is its rows valid on its freeze date. SAGE's MONTH_DIM_1 since 1.5.0: it records no
  # freeze date, so a month as reported is read as it stood on its release date (FIN_MTRC_RLSE_DT), and a month is
  # released once it is no longer SAGE's open brokerage month (DW_BRKRG_MNTH_FRM_TODAY_CT, a flag: 0 for the open month).
  release_driver:
    - {id: wealth-month-end-release, table: wealth.MONTH_DIM_1, period: CLDR_EOM_DT, release_date: FIN_MTRC_RLSE_DT,
       freeze_date: FIN_MTRC_RLSE_DT, released: DW_BRKRG_MNTH_FRM_TODAY_CT}

# -- 1.4.0: mappings to the industry standards the platform preloads (meta-model 1.3.0) ------------------------------------
# The platform preloads a fixed, versioned set of external standards' concepts (standards/preload.yaml at the demo's root:
# FIBO, BIAN, schema.org, SKOS, PROV-O, DCAT, DPV and DCMI Terms) into every client's graph; a pack only maps to them, by
# IRI, and the compiler refuses an IRI the preload does not hold (S30). Each mapping is a SKOS relation read with the
# concept as its object: broadMatch says the standard's concept is the broader. No standard defines net new assets, AUM
# or AUA, so none is mapped exactMatch; AUM and AUA share no exact or close match, since they are never added. The
# Wealth Data Steward certifies the Wealth terms and the account, the Customer Data Steward the personal data.
ontology_mappings:
  - term: net-new-assets
    iri: https://spec.edmcouncil.org/fibo/ontology/FND/Accounting/CashFlows/CashFlow
    relation: broadMatch
    note: >-
      No standard defines net new assets. It nets client money flowing in and out, so FIBO's cash flow is the nearest
      broader concept (of Provisional maturity in FIBO); NNA leaves out market movement, income, excluded accounts and moves
      between a client's own accounts, which a cash flow does not.
    certified_by: Wealth Data Steward
