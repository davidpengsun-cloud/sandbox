    - {phrase: office.valid_to, column: wealth.BRCH_DIM_1.DW_EXPR_DT}
    - {phrase: office.is_current, column: wealth.BRCH_DIM_1.CURR_IN}
    - {phrase: ref_source_system.system_name, column: wealth.SRCE_SYS_1.SRCE_SYS_NM}
  # 1.2.0: the rest of the parser's vocabulary, ported one for one from api/core.py as it was before (its filter
  # phrases and values, the openings that mark a definitional question and the words that mark a count or an average)
  # and from pipeline/privacy.py (the role mailboxes). The parser reads each the same way, on every arm, as it read the
  # code: a filter names a column, and the runtime filters on the column of that name in the unit it plans.
  # A column's values a question filters on: one of the values listed, as written, or a code of a pattern the platform
  # knows (upper_2, two capitals; upper_2_3, two or three; upper_4_plus, four or more; upper_letter, one), after a
  # prefix the value begins with; after one of the phrases given ("region NW") or before one ("GROWTH risk profile").
  value_vocabularies:
    - {column: retail.branch.region_code, after: [region, region is], pattern: upper_2_3}
    - {column: sme.relationship_manager.team_code, prefix: TEAM-, pattern: upper_letter}
    - {column: corporate.counterparty.country_code, after: [incorporated in], pattern: upper_2}
    - {column: wealth.HSHLD_DIM_1.RISK_PRFL_CD, before: [risk profile], pattern: upper_4_plus}
    - column: retail.product.product_name
      values: [Everyday Current, Premier Current, Instant Saver, Fixed Saver, Personal Loan, Rewards Card]
    - {column: corporate.rating.internal_grade, after: [rated], values: [A1, A2, B1, B2, C1, C2]}
  # A condition a phrase sets on a column, whatever the case: with "with", only where one of those words is in the
  # question too, before or after the phrase ("unresolved complaints", "complaints still open").
  predicates:
    - {phrases: [open, unresolved], with: [complaint, complaints], column: retail.complaint.resolved_on, op: is_null}
    - {phrases: [escalated], column: wealth.SUIT_RVW_FACT_1.RVW_OUTCM_CD, op: eq, value: ESCALATED}
    - {phrases: [more than 30 days past due], column: sme.repayment.days_past_due, op: gt, value: 30}
    - {phrases: [in covenant breach], column: sme.covenant.breached_flag, op: is_true}
    # The source system a Wealth flow is booked on, by Meridian's code for it ("NNA from BROKERAGE"), as SAGE's id
    # (100 BROKERAGE, 200 BANK): a bank only as "from BANK" or "on BANK", so the word bank alone is never one.
    - {phrases: [BROKERAGE], column: wealth.TRAN_FACT_1.ACCT_SRCE_SYS_ID, op: eq, value: 100}
    - {phrases: [from BANK, on BANK], column: wealth.TRAN_FACT_1.ACCT_SRCE_SYS_ID, op: eq, value: 200}
  # What marks a question's intent, whatever the case: a definitional question opens with one of its phrases; a count
  # or an average says one anywhere.
  intents:
    - phrases: [what is, what makes, what does, does a, is total, which calendar, how is, where is, may restricted,
                which version, can retail, define]
      intent: definitional
    - {phrases: [how many, number of, count], intent: count}
    - {phrases: [average], intent: avg}
  # Mailboxes that name a function, not a person: an address at one is not personal data, so certification leaves it in
  # clear and the steward queue shows it as likely functional.
  functional_mailboxes: [records, info, support, privacy, helpdesk, noreply, no-reply, admin, enquiries, complaints, retention,
                         dpo, compliance, service, contact]

# Retail and SME report on the calendar year; Corporate and Wealth on a fiscal year from 1 April (FY26-Q1 is April to
# June 2025).
calendars:
  - {id: calendar, year_start_month: 1, quarter_label: "{yyyy}-Q{n}"}
  - {id: fiscal_april, year_start_month: 4, quarter_label: "FY{yy}-Q{n}"}

# Which column carries each table's period: a calendar month (month), a fiscal quarter label (fiscal_quarter), a
# snapshot date (snapshot) or the date something happened (event_date), on which calendar, and the table a month or a
# quarter rolls up through. Thirty-one of the thirty-five tables have one; product, relationship_manager, contact and
# advisor have none. A table with several dates takes the first by name (corporate.deal: maturity_on); resolved_on,
# closed_on and end_on never carry a period. Since 1.1.0, wealth.flow, the net new assets measure's fact, on the date a
# flow was booked; its month and its release go through the declared calendar rollup (joins: flow_month_end). Since 1.5.0
# the flows are SAGE's TRAN_FACT_1, booked on DW_TRAN_DT.
period_bindings:
  - {table: retail.calendar_month, column: month_start, kind: month, calendar: calendar, rollup: {table: retail.calendar_month, column: calendar_quarter}}
  - {table: retail.branch, column: opened_on, kind: event_date, calendar: calendar}
  - {table: retail.customer, column: opened_on, kind: event_date, calendar: calendar}
  - {table: retail.account, column: opened_on, kind: event_date, calendar: calendar}
  - {table: retail.transaction, column: posted_on, kind: event_date, calendar: calendar}
  - {table: retail.monthly_revenue, column: month_start, kind: month, calendar: calendar, rollup: {table: retail.calendar_month, column: calendar_quarter}}
  - {table: retail.daily_balance, column: as_of, kind: snapshot, calendar: calendar}
  - {table: retail.customer_activity, column: month_start, kind: month, calendar: calendar, rollup: {table: retail.calendar_month, column: calendar_quarter}}
  - {table: retail.complaint, column: raised_on, kind: event_date, calendar: calendar}
  - {table: sme.calendar_month, column: month_start, kind: month, calendar: calendar, rollup: {table: sme.calendar_month, column: calendar_quarter}}
  - {table: sme.client, column: onboarded_on, kind: event_date, calendar: calendar}
  - {table: sme.facility, column: start_on, kind: event_date, calendar: calendar}
  - {table: sme.drawdown, column: drawn_on, kind: event_date, calendar: calendar}
  - {table: sme.repayment, column: paid_on, kind: event_date, calendar: calendar}
  - {table: sme.monthly_client_revenue, column: month_start, kind: month, calendar: calendar, rollup: {table: sme.calendar_month, column: calendar_quarter}}
  - {table: sme.client_activity, column: month_start, kind: month, calendar: calendar, rollup: {table: sme.calendar_month, column: calendar_quarter}}
  - {table: sme.covenant, column: tested_on, kind: event_date, calendar: calendar}
  - {table: corporate.fiscal_calendar, column: fiscal_quarter, kind: fiscal_quarter, calendar: fiscal_april, rollup: {table: corporate.fiscal_calendar, column: fiscal_year}}
  - {table: corporate.counterparty, column: onboarded_on, kind: event_date, calendar: calendar}
  - {table: corporate.deal, column: maturity_on, kind: event_date, calendar: calendar}
  - {table: corporate.exposure, column: as_of, kind: snapshot, calendar: calendar}
  - {table: corporate.quarterly_revenue, column: fiscal_quarter, kind: fiscal_quarter, calendar: fiscal_april, rollup: {table: corporate.fiscal_calendar, column: fiscal_year}}
  - {table: corporate.limit_utilisation, column: as_of, kind: snapshot, calendar: calendar}
  - {table: corporate.rating, column: rated_on, kind: event_date, calendar: calendar}
  - {table: wealth.FISCAL_QTR_DIM_1, column: FISCAL_QTR_CD, kind: fiscal_quarter, calendar: fiscal_april, rollup: {table: wealth.FISCAL_QTR_DIM_1, column: FISCAL_YEAR_NR}}
  - {table: wealth.HSHLD_DIM_1, column: HSHLD_ONBRD_DT, kind: event_date, calendar: calendar}
  - {table: wealth.PRTFL_DIM_1, column: PRTFL_INCPTN_DT, kind: event_date, calendar: calendar}
  - {table: wealth.HLDG_FACT_1, column: AS_OF_DT, kind: snapshot, calendar: calendar}
  - {table: wealth.QTR_FEE_REV_FACT_1, column: FISCAL_QTR_CD, kind: fiscal_quarter, calendar: fiscal_april, rollup: {table: wealth.FISCAL_QTR_DIM_1, column: FISCAL_YEAR_NR}}
  - {table: wealth.AUA_FACT_1, column: AS_OF_DT, kind: snapshot, calendar: calendar}
  - {table: wealth.SUIT_RVW_FACT_1, column: RVW_DT, kind: event_date, calendar: calendar}
  - {table: wealth.TRAN_FACT_1, column: DW_TRAN_DT, kind: event_date, calendar: calendar}
  - {table: wealth.AUM_MNTH_END_FACT_1, column: CLDR_EOM_DT, kind: snapshot, calendar: calendar}

# The certified measures, with their grain, currency, calendar and conversion: commensurability across units is derived
# from these by rule, never guessed. The ten ported from before issue #39 are each a sum over a column certified to its
# term. Net new assets (1.1.0) is certified through its contexts and their golden questions instead, since its figure
# is the flows' amount only once its contexts' filters, row selectors and joins have applied: its column maps to no term.
measures:
  - id: retail.revenue
    term: revenue
    column: retail.monthly_revenue.total_revenue_usd
    expression: sum(monthly_revenue.total_revenue_usd)
    aggregation: sum
    grain: month
    currency: USD
    calendar: calendar
    conversion: none
  - id: sme.revenue
    term: revenue
    column: sme.monthly_client_revenue.revenue_usd
    expression: sum(monthly_client_revenue.revenue_usd)
    aggregation: sum
    grain: month
    currency: USD
    calendar: calendar
    conversion: none
  - id: corporate.revenue
    term: revenue
    column: corporate.quarterly_revenue.revenue_usd_converted
    expression: sum(quarterly_revenue.revenue_usd_converted)
    aggregation: sum
    grain: quarter
    currency: USD
    calendar: fiscal_april
    conversion: period_end_rate_from_EUR
  - id: wealth.revenue
    term: revenue
    column: wealth.QTR_FEE_REV_FACT_1.REV_AM
    expression: sum(QTR_FEE_REV_FACT_1.REV_AM)
    aggregation: sum
    grain: quarter
    currency: USD
    calendar: fiscal_april
    conversion: none
  - id: retail.net-interest-income
    term: net-interest-income
    column: retail.monthly_revenue.interest_income
    expression: sum(monthly_revenue.interest_income)
    aggregation: sum
    grain: month
    currency: USD
    calendar: calendar
    conversion: none
  - id: sme.net-interest-income
    term: net-interest-income
    column: sme.monthly_client_revenue.nii
    expression: sum(monthly_client_revenue.nii)
    aggregation: sum
    grain: month
    currency: USD
    calendar: calendar
    conversion: none
  - id: retail.fee-income
    term: fee-income
    column: retail.monthly_revenue.fee_income
    expression: sum(monthly_revenue.fee_income)
    aggregation: sum
    grain: month
    currency: USD
    calendar: calendar
    conversion: none
  - id: sme.fee-income
    term: fee-income
    column: sme.monthly_client_revenue.fees
    expression: sum(monthly_client_revenue.fees)
    aggregation: sum
    grain: month
    currency: USD
    calendar: calendar
    conversion: none
  - id: wealth.assets-under-advice
    term: assets-under-advice
    column: wealth.AUA_FACT_1.AUA_AM
    expression: sum(AUA_FACT_1.AUA_AM)
    aggregation: sum
    grain: quarter_end
    currency: USD
    calendar: fiscal_april
    conversion: none
  - id: corporate.credit-exposure
    term: credit-exposure
    column: corporate.exposure.ead_eur
    expression: sum(exposure.ead_eur)
    aggregation: sum
    grain: as_of
    currency: EUR
    calendar: calendar
    conversion: none
  - id: wealth.net-new-assets
    term: net-new-assets
    column: wealth.TRAN_FACT_1.TRAN_AM
    expression: >-
      sum(CASE WHEN TRAN_FACT_1.DW_TRAN_DIRCTN_CD = 'O' THEN -TRAN_FACT_1.TRAN_AM ELSE TRAN_FACT_1.TRAN_AM END)
    aggregation: sum
    grain: day
    currency: USD
    calendar: fiscal_april
    conversion: none
  # Assets under management (1.3.0), certified through its context and its golden question, as net new assets is.
  - id: wealth.assets-under-management
    term: assets-under-management
    column: wealth.AUM_MNTH_END_FACT_1.AUM_AM
    expression: sum(AUM_MNTH_END_FACT_1.AUM_AM)
    aggregation: sum
    grain: quarter_end
    currency: USD
    calendar: fiscal_april
    conversion: none

