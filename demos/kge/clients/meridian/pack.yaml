# The Meridian pack: Meridian Union Bank's governance graph, as data (../../../../docs/use-cases/kge/platform/pack-contract.md).
#
# Everything here is invented: Meridian Union Bank is the repository's reference institution. The pack is the client's
# own source of truth, plain YAML, read by kge/estate/spec.py and compiled by the platform's compiler (make compile). Each
# section says what it holds; the platform's meta-model (meta-model.yaml, at the demo's root) says what each becomes in
# the graph.
# Ported one for one from estate/spec.py and api/core.py as they were before issue #39 (1.0.0). 1.1.0 adds the Wealth
# expansion's semantics, for meta-model 1.1.0's query-semantics layer: the client cross-reference as a curated source, the
# Wealth terms, acronyms, contexts, filters, row selectors, declared joins, entities, lineage and time policies, and
# Option B's certified join between Retail and Wealth. 1.2.0, for meta-model 1.2.0, adds the rest of the question
# parser's vocabulary from api/core.py and pipeline/privacy.py, so no platform file names the client: its filter phrases
# and values, the openings and words that mark an intent, and the role mailboxes. Issue #40 adds the post-load gates to
# the manifest, at the same version: they reach no graph table, only the artifact's gates.json. 1.3.0 adds assets under
# management (AUM), issue #40's pack-only onboarding test (the plan's Phase 3): its term, aliases and acronym, its period
# binding, measure, joins and context, and deposits as a Retail word, through onboarding's steps 4 to 8 with no platform
# change. 1.4.0, for meta-model 1.3.0, maps net new assets, assets under management and the other Wealth terms, the Wealth
# account and the restricted personal data to the industry standards the platform preloads (ontology_mappings), each
# mapping certified by its steward. 1.5.0 takes in the SAGE wealth data (kge/estate/sage.py): SAGE keeps its physical
# names, and Meridian's names are business names. Wealth's warehouse holds SAGE's seventeen tables as SAGE has them
# (ACCT_DIM2_1, TRAN_FACT_1, MONTH_DIM_1, BRCH_DIM_1, SRCE_SYS_1 and twelve more), every column as SAGE spells it;
# Meridian's account, flow, month end, office and source system tables are dropped, and its fifteen other Wealth tables
# take physical names in SAGE's style (HSHLD_DIM_1, AUM_MNTH_END_FACT_1, ...: kge/estate/names.py). Every Wealth table's
# name and every Meridian column name are business names in the curated layer: an entity each table represents and an
# alias of each column. The Wealth terms, measures, contexts, filters, row selectors, joins, acronyms and policies read the
# physical columns, and the pack gains the account's client code and office joins and the restricted columns of the SAGE
# tables' personal data.
manifest:
  client: meridian
  meta_model_version: 1.3.0
  id: meridian-governance
  version: 1.5.0
  title: Meridian Union Bank governance graph
  owners: [group-finance-data-steward, customer-data-steward]
  platform: {meta_model: "^1.3", compiler: ">=0.4"}   # the platform versions this pack is compatible with
  # store names the DDL dialect, kuzu's, which Ladybug loads; Ladybug is the only graph store.
  compile: {store: kuzu, embedding_dim: 128, id_scheme: v1}
  # The post-load gates (onboarding step 7): the share of golden questions graph on must pass, per kind, and how far
  # ahead of graph off it must be, per kind; make margin checks a loaded graph against them, a candidate before it is
  # released. The template's values (../../../../docs/use-cases/kge/platform/pack.example.yaml).
  gates:
    golden_min_pass: {within: 1.0, cross: 1.0, shelf: 1.0, abstain: 1.0}
    control_margin: {cross: 0.5, shelf: 0.5}

schema: {meta_model: "1.3", extensions: []}

# The four business units, each with its own warehouse and no key that joins across them. Their order fixes the pairs'
# names (retail-sme, and so on). Each unit's customer-like key is its entity_key. They are deliberately different, and
# the corporate contact table carries a column *named* customer_id that is not the retail one: the trap a key-name join
# would fall into. Tables and columns are not listed: harvest has them come from each warehouse's own catalogue, as
# certification landed it, keys declared, so the join paths within a unit are regenerable. pack.lock, beside this file,
# freezes that catalogue (make lock writes it, and make graph stops if it is stale).
sources:
  - id: retail
    label: Retail Banking
    entity_key: customer_id
    connection: {dialect: duckdb, ref: warehouses/retail.duckdb}
    harvest: true
  - id: sme
    label: SME Banking
    entity_key: client_no
    connection: {dialect: duckdb, ref: warehouses/sme.duckdb}
    harvest: true
  - id: corporate
    label: Corporate & Institutional
    entity_key: counterparty_ref
    connection: {dialect: duckdb, ref: warehouses/corporate.duckdb}
    harvest: true
  - id: wealth
    label: Wealth Management
    entity_key: HSHLD_DK
    connection: {dialect: duckdb, ref: warehouses/wealth.duckdb}
    harvest: true

# The curated layer's own sources, beside the units and none of them: the certified client cross-reference, which links
# a Retail customer to the Wealth household member who is the same client. It lives with the curated layer, not inside
# either unit's harvest: no principal reads it on its own, and it is joined only through the certified join below.
# Matching happens upstream and offline, on whatever personal data it takes; the table holds ids, never that data.
curated_sources:
  - id: xref
    label: Certified client cross-reference
    connection: {dialect: duckdb, ref: warehouses/xref.duckdb}
    harvest: true

# The asserted absence of a join between units, one per pair. Curated once by the people who designed the federation.
# Its absence from a re-harvest must never be read as its falsity, so it lives here and not in any warehouse.
no_join:
  - between: [retail, sme]
    asserted_by: Data Architecture Board
    asserted_on: "2024-03-12"
    note: Separate customer populations and separate key domains by design. No mapping table exists.
  - between: [retail, corporate]
    asserted_by: Data Architecture Board
    asserted_on: "2024-03-12"
    note: >-
      corporate.contact.customer_id is a CRM contact number. It shares a name with retail.customer.customer_id and
      nothing else. No mapping table exists.
  - between: [sme, corporate]
    asserted_by: Data Architecture Board
    asserted_on: "2024-03-12"
    note: Separate customer populations and separate key domains by design. No mapping table exists.
  - between: [sme, wealth]
    asserted_by: Data Architecture Board
    asserted_on: "2024-03-12"
    note: Separate customer populations and separate key domains by design. No mapping table exists.
  - between: [corporate, wealth]
    asserted_by: Data Architecture Board
    asserted_on: "2024-03-12"
    note: Separate customer populations and separate key domains by design. No mapping table exists.

# The asserted presence of a join between two units, through a declared cross-reference (joins, below). Since 1.1.0
# (issue #39's Option B) Retail and Wealth join through the certified client cross-reference: this fact replaces the
# no-join fact the Data Architecture Board asserted for retail-wealth on 2024-03-12 ("Separate customer populations and
# separate key domains by design. No mapping table exists."). Every other pair keeps its no-join fact.
certified_joins:
  - between: [retail, wealth]
    join: client_xref
    asserted_by: Data Architecture Board
    asserted_on: "2026-10-10"
    note: certified client cross-reference

# A no-join fact refined to the column it is about: corporate.contact.customer_id is a CRM contact number, and never
# joins to the Retail customer it shares a name with. The runtime still reads the no-join facts above.
not_joinable:
  - column: corporate.contact.customer_id
    table: retail.customer
    asserted_by: Data Architecture Board
    asserted_on: "2024-03-12"
    note: >-
      corporate.contact.customer_id is a CRM contact number. It shares a name with retail.customer.customer_id and
      nothing else. No mapping table exists.

# One enterprise glossary, owned by the CDO's stewards. A term is keyed by its name in the graph; id is its stable slug.
# defined_by names the certified metric definitions that define it.
glossary:
  - id: revenue
    name: Revenue
    domain: Finance
    steward: Group Finance Data Steward
    status: certified
    definition: >-
      Income earned from customers in a period, before costs. Each business unit reports it at its own grain,
      currency and calendar; see the implementation metadata.
    defined_by: [MD-REVENUE]
  - id: net-interest-income
    name: Net Interest Income
    domain: Finance
    steward: Group Finance Data Steward
    status: certified
    definition: Interest earned less interest paid, in the reporting currency, for the period.
    defined_by: [MD-NET-INTEREST-INCOME]
  - id: fee-income
    name: Fee Income
    domain: Finance
    steward: Group Finance Data Steward
    status: certified
    definition: Fees and commissions charged to customers in the period.
    defined_by: [MD-FEE-INCOME]
  - id: active-customer
    name: Active Customer
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: >-
      A customer with at least one customer-initiated transaction in the calendar month. Logins alone do not count.
      Version 2, effective 1 January 2025.
    defined_by: [MD-ACTIVE-CUSTOMER, MD-ACTIVE-CUSTOMER-V1]
  - id: assets-under-advice
    name: Assets Under Advice
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: Market value of client assets on which the firm gives advice, at quarter end, USD.
    defined_by: [MD-ASSETS-UNDER-ADVICE]
  - id: credit-exposure
    name: Credit Exposure
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: Exposure at default to a counterparty at the measurement date.
    defined_by: [MD-CREDIT-EXPOSURE]
  - id: delinquency-rate
    name: Delinquency Rate
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: Share of scheduled repayments more than 30 days past due in the month.
    defined_by: [MD-DELINQUENCY-RATE]
  - id: customer-attrition
    name: Customer Attrition
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: Customers whose last account closed in the month, as a share of opening customers.
    defined_by: [MD-CUSTOMER-ATTRITION]
  - id: average-balance
    name: Average Balance
    domain: Finance
    steward: Group Finance Data Steward
    status: certified
    definition: Mean end-of-day ledger balance over the calendar month.
    defined_by: [MD-AVERAGE-BALANCE]
  - id: dormant-account
    name: Dormant Account
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: An open account with no customer-initiated transaction for twelve months.
  - id: limit-utilisation
    name: Limit Utilisation
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: Utilised amount as a share of the approved limit at the measurement date.
  - id: covenant-breach
    name: Covenant Breach
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: A covenant whose most recent test failed its threshold.
  - id: suitability-review
    name: Suitability Review
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: A documented review of whether a household's portfolio remains suitable.
  - id: complaint
    name: Complaint
    domain: Conduct
    steward: Conduct Data Steward
    status: certified
    definition: An expression of dissatisfaction recorded under the complaints handling procedure.
  - id: notional
    name: Notional
    domain: Markets
    steward: Markets Data Steward
    status: certified
    definition: Face value of a derivative or loan deal, in deal currency.
  - id: probability-of-default
    name: Probability of Default
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: Twelve-month probability of default, in basis points.
  - id: loss-given-default
    name: Loss Given Default
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: Expected loss as a share of exposure if the counterparty defaults.
  - id: internal-rating
    name: Internal Rating
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: The bank's own credit grade for a counterparty.
  - id: household
    name: Household
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: "The unit of advice in wealth management: one or more related clients advised together."
  - id: relationship-manager
    name: Relationship Manager
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: The named individual accountable for an SME client relationship.
  - id: fiscal-year
    name: Fiscal Year
    domain: Finance
    steward: Group Finance Data Steward
    status: certified
    definition: >-
      The twelve months from 1 April, used by Corporate and Wealth. Retail and SME report on the calendar year.
    defined_by: [MD-FISCAL-YEAR]
  - id: period-end-fx-rate
    name: Period-End FX Rate
    domain: Finance
    steward: Group Finance Data Steward
    status: certified
    definition: The exchange rate on the last day of the period, used to convert Corporate revenue to USD.
    defined_by: [MD-PERIOD-END-FX-RATE]
  - id: product-holding
    name: Product Holding
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: Count of distinct open products held by a customer.
  - id: new-to-bank-customer
    name: New-to-Bank Customer
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: A customer whose first account opened in the month.
  - id: market-value
    name: Market Value
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: Value of a holding at the valuation date in portfolio base currency.
  - id: digital-login
    name: Digital Login
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: An authenticated session on the mobile or online channel.
  - id: branch
    name: Branch
    domain: Distribution
    steward: Distribution Data Steward
    status: certified
    definition: A physical retail location.
  - id: segment
    name: Segment
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: Marketing segment assigned to a retail customer.
  - id: facility
    name: Facility
    domain: Lending
    steward: Credit Risk Data Steward
    status: certified
    definition: A committed or uncommitted lending line to an SME client.
  - id: drawdown
    name: Drawdown
    domain: Lending
    steward: Credit Risk Data Steward
    status: certified
    definition: A utilisation of a facility.
  - id: counterparty
    name: Counterparty
    domain: Markets
    steward: Markets Data Steward
    status: certified
    definition: A legal entity with which the bank transacts in Corporate & Institutional.
  - id: legal-entity-identifier
    name: Legal Entity Identifier
    domain: Markets
    steward: Markets Data Steward
    status: certified
    definition: The 20-character identifier for a counterparty under the global LEI system.
  - id: risk-profile
    name: Risk Profile
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: The household's agreed appetite for investment risk.
  - id: mandate
    name: Mandate
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: Whether the firm manages a portfolio at its discretion or advises only.
  - id: channel
    name: Channel
    domain: Distribution
    steward: Distribution Data Steward
    status: certified
    definition: The route by which a transaction was initiated.
  - id: merchant-category
    name: Merchant Category
    domain: Payments
    steward: Payments Data Steward
    status: certified
    definition: The card-scheme category of a merchant.
  - id: resolved-complaint
    name: Resolved Complaint
    domain: Conduct
    steward: Conduct Data Steward
    status: certified
    definition: A complaint with a recorded resolution date.
  - id: open-account
    name: Open Account
    domain: Customer
    steward: Customer Data Steward
    status: certified
    definition: An account whose status is OPEN at the reference date.
  - id: days-past-due
    name: Days Past Due
    domain: Risk
    steward: Credit Risk Data Steward
    status: certified
    definition: Days elapsed since a scheduled repayment date without payment.
  - id: sector
    name: Sector
    domain: Markets
    steward: Markets Data Steward
    status: certified
    definition: Industry sector of a counterparty.
  # The Wealth expansion's terms (1.1.0).
  - id: net-new-assets
    name: Net New Assets
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: >-
      Money clients bring to the firm less money they take away, in USD, over released months: eligible flows only, with
      test accounts and excluded accounts left out. A move between a client's own accounts is not new money.
  - id: client-directed-nna
    name: Client-Directed NNA
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: Net new assets from the flows a client instructed, not from those the firm books itself.
  - id: test-account
    name: Test Account
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: An account opened to test the firm's systems, never a client's holding. Its flows count towards no figure.
  - id: nna-eligibility
    name: NNA Eligibility
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: Whether a flow counts towards net new assets, as its flow type and the eligibility rules decide.
  - id: exclusion
    name: Exclusion
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: >-
      An account left out of net new assets for a stated reason, from an effective date until it ends; while it is in
      force it overrides the eligibility of the account's flows.
  - id: month-end-release-freeze
    name: Month-End Release / Freeze
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: >-
      A month's figures are frozen on its freeze date and released on its release date. Only released months are
      reported; a month as reported is its figures as they stood at the freeze, and as restated, as they stand now.
  - id: source-system
    name: Source System
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: The platform an account is booked on, BANK or BROKERAGE. An account number is unique only within its source system.
  - id: division
    name: Division
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: The top of the advisory office hierarchy. Offices roll up to regions, and regions to divisions.
  # Assets under management (1.3.0, issue #40): a pack edit alone, onboarding's step 9. No document defines it, so a
  # question on what it means is answered from this definition.
  - id: assets-under-management
    name: Assets Under Management
    domain: Wealth
    steward: Wealth Data Steward
    status: certified
    definition: >-
      The market value of a household's holdings with the firm, at each quarter end, in USD. Not assets under advice:
      the two are different measures and are never added.

# The phrases the question parser reads. A phrase names a term (by id), a source, or a candidate term that is not in
# the glossary yet and is routed to a steward. The longest phrase found wins; in a tie, the first listed.
terminology:
  aliases:
    - {phrase: revenue, term: revenue}
    - {phrase: net interest income, term: net-interest-income}
    - {phrase: fee income, term: fee-income}
    - {phrase: active customer, term: active-customer}
    - {phrase: active customers, term: active-customer}
    - {phrase: active clients, term: active-customer}
    - {phrase: active in, term: active-customer}
    - {phrase: assets under advice, term: assets-under-advice}
    - {phrase: credit exposure, term: credit-exposure}
    - {phrase: delinquency rate, term: delinquency-rate}
    - {phrase: attrition, term: customer-attrition}
    - {phrase: average ledger balance, term: average-balance}
    - {phrase: average balance, term: average-balance}
    - {phrase: complaints, term: complaint}
    - {phrase: covenant breach, term: covenant-breach}
    - {phrase: past due, term: days-past-due}
    - {phrase: rated, term: internal-rating}
    - {phrase: suitability reviews, term: suitability-review}
    - {phrase: customer active, term: active-customer}
    - {phrase: converted, term: period-end-fx-rate}
    - {phrase: calendar does, term: fiscal-year}
    - {phrase: digital engagement score, candidate: Digital Engagement Score}
    - {phrase: retail, source: retail}
    - {phrase: sme, source: sme}
    - {phrase: corporate, source: corporate}
    - {phrase: wealth, source: wealth}
    # 1.1.0: metric variants, the time modes a figure is asked in, the latest month, the dimensions a figure is grouped
    # by (a column) and the entities a question names by id ("household 5001").
    - {phrase: nna, term: net-new-assets}
    - {phrase: client directed nna, term: client-directed-nna}
    - {phrase: aum, term: assets-under-management}
    - {phrase: assets under management, term: assets-under-management}
    - {phrase: as reported, time_mode: as_reported}
    - {phrase: restated, time_mode: restated}
    - {phrase: latest month, period: latest}
    - {phrase: by division, group_by: wealth.DIVSN_DIM_1.DIVSN_CD}
    - {phrase: by region, group_by: wealth.RGN_DIM_1.RGN_CD}
    - {phrase: by office, group_by: wealth.BRCH_DIM_1.BRCH_CD}
    - {phrase: by advisor office, group_by: wealth.BRCH_DIM_1.BRCH_CD}
    - {phrase: by parent segment, group_by: wealth.CLNT_SEGMT_DIM_1.PARNT_SEGMT_CD}
    - {phrase: by source system, group_by: wealth.TRAN_FACT_1.ACCT_SRCE_SYS_ID}
    - {phrase: household, entity: wealth_household}
    - {phrase: customer, entity: retail_customer}
    # The advisory business is Wealth's: a question about advisory assets or inflows names the unit (the owner's
    # cross-unit questions), so one that pairs it with Retail needs both, through the certified join.
    - {phrase: advisory, source: wealth}
    # Deposits are Retail's (1.3.0): a question that pairs them with advisory assets names both units, through the
    # certified join, as the owner's cross-unit questions do.
    - {phrase: deposits, source: retail}
    # A Wealth account is an entity a question counts ("how many accounts"), by its whole key; and a question about the
    # accounts excluded names the exclusion, which net new assets leaves out, so its figure is not that question's.
    - {phrase: account, entity: wealth_account}
    - {phrase: excluded, term: exclusion}
    # A term whose name no question says whole, Month-End Release / Freeze, is named by either half of it: so a question
    # on what it means is answered from its definition here, which no document gives.
    - {phrase: month-end release, term: month-end-release-freeze}
    - {phrase: month-end freeze, term: month-end-release-freeze}
    - {phrase: month end release, term: month-end-release-freeze}
    - {phrase: month end freeze, term: month-end-release-freeze}
    # The business names of Wealth's columns (1.5.0, kge/estate/names.py): each column a Meridian table has, and each SAGE
    # column a dropped Meridian table held under a name of its own, as <business table>.<business column>, names the
    # physical column that holds it. The parser reads none of them for a condition; they let a business name resolve to
    # the column the SQL reads, in an answer, a plan's check of what it applies and a restricted column's name.
    - {phrase: fiscal_calendar.fiscal_quarter, column: wealth.FISCAL_QTR_DIM_1.FISCAL_QTR_CD}
    - {phrase: fiscal_calendar.fiscal_year, column: wealth.FISCAL_QTR_DIM_1.FISCAL_YEAR_NR}
    - {phrase: fiscal_calendar.quarter_start, column: wealth.FISCAL_QTR_DIM_1.QRTR_START_CLDR_DT}
    - {phrase: fiscal_calendar.quarter_end, column: wealth.FISCAL_QTR_DIM_1.QRTR_END_CLDR_DT}
    - {phrase: advisor.advisor_id, column: wealth.ADV_DIM_1.ADV_ID}
    - {phrase: advisor.advisor_name, column: wealth.ADV_DIM_1.ADV_NM}
    - {phrase: advisor.office_code, column: wealth.ADV_DIM_1.BRCH_CD}
    - {phrase: advisor.licence_class, column: wealth.ADV_DIM_1.LICNS_CLS_CD}
    - {phrase: household.household_id, column: wealth.HSHLD_DIM_1.HSHLD_DK}
    - {phrase: household.household_name, column: wealth.HSHLD_DIM_1.HSHLD_NM}
    - {phrase: household.primary_advisor_id, column: wealth.HSHLD_DIM_1.PRIM_ADV_ID}
    - {phrase: household.risk_profile, column: wealth.HSHLD_DIM_1.RISK_PRFL_CD}
    - {phrase: household.onboarded_on, column: wealth.HSHLD_DIM_1.HSHLD_ONBRD_DT}
    - {phrase: portfolio.portfolio_id, column: wealth.PRTFL_DIM_1.PRTFL_ID}
    - {phrase: portfolio.household_id, column: wealth.PRTFL_DIM_1.HSHLD_DK}
    - {phrase: portfolio.mandate_type, column: wealth.PRTFL_DIM_1.MNDT_TYPE_CD}
    - {phrase: portfolio.base_currency, column: wealth.PRTFL_DIM_1.BASE_CRNCY_CD}
    - {phrase: portfolio.inception_on, column: wealth.PRTFL_DIM_1.PRTFL_INCPTN_DT}
    - {phrase: holding.holding_id, column: wealth.HLDG_FACT_1.HLDG_ID}
    - {phrase: holding.portfolio_id, column: wealth.HLDG_FACT_1.PRTFL_ID}
    - {phrase: holding.as_of, column: wealth.HLDG_FACT_1.AS_OF_DT}
    - {phrase: holding.instrument_id, column: wealth.HLDG_FACT_1.INSTR_ID}
    - {phrase: holding.quantity, column: wealth.HLDG_FACT_1.HLDG_QY}
    - {phrase: holding.market_value, column: wealth.HLDG_FACT_1.MKT_VAL_AM}
