  xref:
    label: Certified client cross-reference
    tables:
    - name: client_xref
      columns:
      - name: xref_id
        type: INTEGER
        description: Cross-reference identifier
      - name: retail_customer_id
        type: INTEGER
        description: Retail customer, as retail.customer.customer_id
      - name: household_id
        type: INTEGER
        description: Wealth household, as wealth.HSHLD_DIM_1.HSHLD_DK
      - name: member_id
        type: INTEGER
        description: The household member the customer is, as wealth.HSHLD_MBR_1.MBR_ID
      - name: source_system
        type: VARCHAR
        description: Wealth source system the match was made against
      - name: valid_from
        type: DATE
        description: First day this version of the match holds
      - name: valid_to
        type: DATE
        description: Last day this version of the match holds, null while it is current
      - name: is_current
        type: BOOLEAN
        description: True for the version that holds today
      - name: match_method
        type: VARCHAR
        description: DETERMINISTIC, PROBABILISTIC or MANUAL
      - name: match_confidence
        type: DECIMAL(4,3)
        description: Confidence in the match, from 0 to 1
      - name: certification_status
        type: VARCHAR
        description: 'CERTIFIED, PROPOSED or REJECTED: only a CERTIFIED match may
          be joined on'
      - name: certified_by
        type: VARCHAR
        description: Steward who certified the match
      - name: certified_on
        type: DATE
        description: Date the match was certified
      primary_key:
      - xref_id
      - valid_from
      foreign_keys: []
