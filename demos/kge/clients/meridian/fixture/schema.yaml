warehouses:
  retail:
    label: Retail Banking
    tables:
    - name: branch
      columns:
      - name: branch_id
        type: INTEGER
        description: Branch identifier
      - name: branch_name
        type: VARCHAR
        description: Branch trading name
      - name: region_code
        type: VARCHAR
        description: Sales region code
      - name: opened_on
        type: DATE
        description: Date the branch opened
      primary_key:
      - branch_id
      foreign_keys: []
    - name: calendar_month
      columns:
      - name: month_start
        type: DATE
        description: First day of the calendar month
      - name: calendar_year
        type: INTEGER
        description: Calendar year
      - name: calendar_quarter
        type: VARCHAR
        description: Calendar quarter, e.g. 2025-Q2
      primary_key:
      - month_start
      foreign_keys: []
    - name: product
      columns:
      - name: product_id
        type: INTEGER
        description: Product identifier
      - name: product_name
        type: VARCHAR
        description: Product marketing name
      - name: product_family
        type: VARCHAR
        description: Current account, savings, lending, card
      - name: rate_bps
        type: INTEGER
        description: Headline rate in basis points
      - name: fee_monthly
        type: DECIMAL(10,2)
        description: Monthly account fee in USD
      primary_key:
      - product_id
      foreign_keys: []
    - name: customer
      columns:
      - name: customer_id
        type: INTEGER
        description: Retail customer identifier
      - name: first_name
        type: VARCHAR
        description: Customer first name
      - name: last_name
        type: VARCHAR
        description: Customer last name
      - name: date_of_birth
        type: DATE
        description: Customer date of birth
      - name: email
        type: VARCHAR
        description: Customer email address
      - name: segment_code
        type: VARCHAR
        description: Marketing segment code
      - name: branch_id
        type: INTEGER
        description: Home branch
      - name: opened_on
        type: DATE
        description: Date the relationship opened
      primary_key:
      - customer_id
      foreign_keys:
      - columns:
        - branch_id
        ref_table: branch
        ref_columns:
        - branch_id
    - name: account
      columns:
      - name: account_id
        type: INTEGER
        description: Account identifier
      - name: customer_id
        type: INTEGER
        description: Owning customer
      - name: product_id
        type: INTEGER
        description: Product held
      - name: status_code
        type: VARCHAR
        description: OPEN, DORMANT or CLOSED
      - name: opened_on
        type: DATE
        description: Date opened
      - name: closed_on
        type: DATE
        description: Date closed, null while open
      - name: currency_code
        type: VARCHAR
        description: Account currency, always USD in retail
      primary_key:
      - account_id
      foreign_keys:
      - columns:
        - customer_id
        ref_table: customer
        ref_columns:
        - customer_id
      - columns:
        - product_id
        ref_table: product
        ref_columns:
        - product_id
    - name: complaint
      columns:
      - name: complaint_id
        type: INTEGER
        description: Complaint identifier
      - name: customer_id
        type: INTEGER
        description: Complainant
      - name: raised_on
        type: DATE
        description: Date raised
      - name: category
        type: VARCHAR
        description: Complaint category
      - name: resolved_on
        type: DATE
        description: Date resolved, null while open
      primary_key:
      - complaint_id
      foreign_keys:
      - columns:
        - customer_id
        ref_table: customer
        ref_columns:
        - customer_id
    - name: customer_activity
      columns:
      - name: activity_id
        type: INTEGER
        description: Row identifier
      - name: customer_id
        type: INTEGER
        description: Customer
      - name: month_start
        type: DATE
        description: Calendar month
      - name: login_count
        type: INTEGER
        description: Digital logins in the month
      - name: txn_count
        type: INTEGER
        description: Customer-initiated transactions in the month
      - name: is_active_flag
        type: BOOLEAN
        description: True where txn_count is at least one in the month
      primary_key:
      - activity_id
      foreign_keys:
      - columns:
        - customer_id
        ref_table: customer
        ref_columns:
        - customer_id
      - columns:
        - month_start
        ref_table: calendar_month
        ref_columns:
        - month_start
    - name: daily_balance
      columns:
      - name: balance_id
        type: BIGINT
        description: Row identifier
      - name: account_id
        type: INTEGER
        description: Account
      - name: as_of
        type: DATE
        description: Balance date
      - name: ledger_balance
        type: DECIMAL(14,2)
        description: End-of-day ledger balance
      - name: available_balance
        type: DECIMAL(14,2)
        description: End-of-day available balance
      primary_key:
      - balance_id
      foreign_keys:
      - columns:
        - account_id
        ref_table: account
        ref_columns:
        - account_id
    - name: monthly_revenue
      columns:
      - name: revenue_id
        type: INTEGER
        description: Row identifier
      - name: account_id
        type: INTEGER
        description: Account the revenue accrues to
      - name: month_start
        type: DATE
        description: Calendar month
      - name: interest_income
        type: DECIMAL(14,2)
        description: Net interest income for the month, USD
      - name: fee_income
        type: DECIMAL(14,2)
        description: Fee income for the month, USD
      - name: total_revenue_usd
        type: DECIMAL(14,2)
        description: Interest plus fees, USD, calendar month
      primary_key:
      - revenue_id
      foreign_keys:
      - columns:
        - account_id
        ref_table: account
        ref_columns:
        - account_id
      - columns:
        - month_start
        ref_table: calendar_month
        ref_columns:
        - month_start
    - name: transaction
      columns:
      - name: txn_id
        type: BIGINT
        description: Transaction identifier
      - name: account_id
        type: INTEGER
        description: Account posted to
      - name: posted_on
        type: DATE
        description: Posting date
      - name: amount
        type: DECIMAL(14,2)
        description: Signed amount in account currency
      - name: txn_type
        type: VARCHAR
        description: DEBIT or CREDIT
      - name: channel_code
        type: VARCHAR
        description: BRANCH, ATM, ONLINE, MOBILE
      - name: merchant_category
        type: VARCHAR
        description: Merchant category code where applicable
      - name: counterparty_bank
        type: VARCHAR
        description: Institution on the other side of a transfer; MERIDIAN for an
          account held here
      - name: counterparty_account
        type: BIGINT
        description: Account number on the other side of a transfer, at that institution
      primary_key:
      - txn_id
      foreign_keys:
      - columns:
        - account_id
        ref_table: account
        ref_columns:
        - account_id
  sme:
    label: SME Banking
    tables:
    - name: calendar_month
      columns:
      - name: month_start
        type: DATE
        description: First day of the calendar month
      - name: calendar_year
        type: INTEGER
        description: Calendar year
      - name: calendar_quarter
        type: VARCHAR
        description: Calendar quarter
      primary_key:
      - month_start
      foreign_keys: []
    - name: relationship_manager
      columns:
      - name: rm_id
        type: INTEGER
        description: Relationship manager identifier
      - name: rm_name
        type: VARCHAR
        description: Relationship manager name
      - name: team_code
        type: VARCHAR
        description: Coverage team
      primary_key:
      - rm_id
      foreign_keys: []
    - name: client
      columns:
      - name: client_no
        type: INTEGER
        description: SME client number
      - name: legal_name
        type: VARCHAR
        description: Registered legal name
      - name: registration_no
        type: VARCHAR
        description: Company registration number
      - name: industry_code
        type: VARCHAR
        description: Industry classification code
      - name: rm_id
        type: INTEGER
        description: Covering relationship manager
      - name: onboarded_on
        type: DATE
        description: Onboarding date
      primary_key:
      - client_no
      foreign_keys:
      - columns:
        - rm_id
        ref_table: relationship_manager
        ref_columns:
        - rm_id
    - name: client_activity
      columns:
      - name: activity_id
        type: INTEGER
        description: Row identifier
      - name: client_no
        type: INTEGER
        description: Client
      - name: month_start
        type: DATE
        description: Calendar month
      - name: payments_count
        type: INTEGER
        description: Outbound payments in the month
      - name: active_flag
        type: BOOLEAN
        description: True where payments_count is at least one
      primary_key:
      - activity_id
      foreign_keys:
      - columns:
        - client_no
        ref_table: client
        ref_columns:
        - client_no
      - columns:
        - month_start
        ref_table: calendar_month
        ref_columns:
        - month_start
    - name: facility
      columns:
      - name: facility_id
        type: INTEGER
        description: Facility identifier
      - name: client_no
        type: INTEGER
        description: Borrowing client
      - name: facility_type
        type: VARCHAR
        description: TERM_LOAN, OVERDRAFT, INVOICE_FINANCE
      - name: limit_amount
        type: DECIMAL(14,2)
        description: Approved limit
      - name: currency_code
        type: VARCHAR
        description: Facility currency, USD
      - name: start_on
        type: DATE
        description: Facility start
      - name: end_on
        type: DATE
        description: Facility maturity
      primary_key:
      - facility_id
      foreign_keys:
      - columns:
        - client_no
        ref_table: client
        ref_columns:
        - client_no
    - name: monthly_client_revenue
      columns:
      - name: rev_id
        type: INTEGER
        description: Row identifier
      - name: client_no
        type: INTEGER
        description: Client
      - name: month_start
        type: DATE
        description: Calendar month
      - name: nii
        type: DECIMAL(14,2)
        description: Net interest income, USD
      - name: fees
        type: DECIMAL(14,2)
        description: Fee income, USD
      - name: revenue_usd
        type: DECIMAL(14,2)
        description: NII plus fees, USD, calendar month
      primary_key:
      - rev_id
      foreign_keys:
      - columns:
        - client_no
        ref_table: client
        ref_columns:
        - client_no
      - columns:
        - month_start
        ref_table: calendar_month
        ref_columns:
        - month_start
    - name: covenant
      columns:
      - name: covenant_id
        type: INTEGER
        description: Covenant identifier
      - name: facility_id
        type: INTEGER
        description: Facility the covenant attaches to
      - name: covenant_type
        type: VARCHAR
        description: LEVERAGE, INTEREST_COVER, MIN_LIQUIDITY
      - name: threshold
        type: DECIMAL(10,4)
        description: Covenant threshold
      - name: tested_on
        type: DATE
        description: Last test date
      - name: breached_flag
        type: BOOLEAN
        description: True where the last test breached
      primary_key:
      - covenant_id
      foreign_keys:
      - columns:
        - facility_id
        ref_table: facility
        ref_columns:
        - facility_id
    - name: drawdown
      columns:
      - name: drawdown_id
        type: INTEGER
        description: Drawdown identifier
      - name: facility_id
        type: INTEGER
        description: Facility drawn
      - name: drawn_on
        type: DATE
        description: Drawdown date
      - name: amount
        type: DECIMAL(14,2)
        description: Amount drawn
      primary_key:
      - drawdown_id
      foreign_keys:
      - columns:
        - facility_id
        ref_table: facility
        ref_columns:
        - facility_id
    - name: repayment
      columns:
      - name: repayment_id
        type: INTEGER
        description: Repayment identifier
      - name: facility_id
        type: INTEGER
        description: Facility repaid
      - name: paid_on
        type: DATE
        description: Payment date
      - name: amount
        type: DECIMAL(14,2)
        description: Amount paid
      - name: days_past_due
        type: INTEGER
        description: Days past the scheduled date, zero when on time
      primary_key:
      - repayment_id
      foreign_keys:
      - columns:
        - facility_id
        ref_table: facility
        ref_columns:
        - facility_id
  corporate:
    label: Corporate & Institutional
    tables:
    - name: counterparty
      columns:
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty reference
      - name: counterparty_name
        type: VARCHAR
        description: Legal entity name
      - name: lei_code
        type: VARCHAR
        description: Legal entity identifier
      - name: country_code
        type: VARCHAR
        description: Country of incorporation
      - name: sector_code
        type: VARCHAR
        description: Sector classification
      - name: onboarded_on
        type: DATE
        description: Onboarding date
      primary_key:
      - counterparty_ref
      foreign_keys: []
    - name: fiscal_calendar
      columns:
      - name: fiscal_quarter
        type: VARCHAR
        description: Fiscal quarter label, e.g. FY25-Q1
      - name: fiscal_year
        type: INTEGER
        description: Fiscal year, starting 1 April
      - name: quarter_start
        type: DATE
        description: First day of the fiscal quarter
      - name: quarter_end
        type: DATE
        description: Last day of the fiscal quarter
      primary_key:
      - fiscal_quarter
      foreign_keys: []
    - name: contact
      columns:
      - name: contact_id
        type: INTEGER
        description: Contact identifier
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty the contact belongs to
      - name: customer_id
        type: INTEGER
        description: CRM contact number. Not the retail customer identifier, despite
          the name
      - name: contact_name
        type: VARCHAR
        description: Contact name
      - name: contact_email
        type: VARCHAR
        description: Contact email
      - name: role_code
        type: VARCHAR
        description: TREASURER, CFO, OPERATIONS
      primary_key:
      - contact_id
      foreign_keys:
      - columns:
        - counterparty_ref
        ref_table: counterparty
        ref_columns:
        - counterparty_ref
    - name: deal
      columns:
      - name: deal_id
        type: INTEGER
        description: Deal identifier
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty
      - name: product_code
        type: VARCHAR
        description: FX_FWD, IRS, LOAN, BOND
      - name: notional_eur
        type: DECIMAL(16,2)
        description: Notional in EUR
      - name: trade_on
        type: DATE
        description: Trade date
      - name: maturity_on
        type: DATE
        description: Maturity date
      primary_key:
      - deal_id
      foreign_keys:
      - columns:
        - counterparty_ref
        ref_table: counterparty
        ref_columns:
        - counterparty_ref
    - name: exposure
      columns:
      - name: exposure_id
        type: INTEGER
        description: Row identifier
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty
      - name: as_of
        type: DATE
        description: Measurement date
      - name: ead_eur
        type: DECIMAL(16,2)
        description: Exposure at default, EUR
      - name: pd_bps
        type: INTEGER
        description: Probability of default, basis points
      - name: lgd_pct
        type: DECIMAL(5,2)
        description: Loss given default, per cent
      primary_key:
      - exposure_id
      foreign_keys:
      - columns:
        - counterparty_ref
        ref_table: counterparty
        ref_columns:
        - counterparty_ref
    - name: limit_utilisation
      columns:
      - name: util_id
        type: INTEGER
        description: Row identifier
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty
      - name: as_of
        type: DATE
        description: Measurement date
      - name: limit_eur
        type: DECIMAL(16,2)
        description: Approved limit, EUR
      - name: utilised_eur
        type: DECIMAL(16,2)
        description: Utilised amount, EUR
      primary_key:
      - util_id
      foreign_keys:
      - columns:
        - counterparty_ref
        ref_table: counterparty
        ref_columns:
        - counterparty_ref
    - name: quarterly_revenue
      columns:
      - name: qrev_id
        type: INTEGER
        description: Row identifier
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty
      - name: fiscal_quarter
        type: VARCHAR
        description: Fiscal quarter
      - name: revenue_eur
        type: DECIMAL(16,2)
        description: Revenue in EUR for the fiscal quarter
      - name: fx_rate_period_end
        type: DECIMAL(10,6)
        description: EUR to USD rate at quarter end
      - name: revenue_usd_converted
        type: DECIMAL(16,2)
        description: Revenue converted to USD at the period-end rate
      primary_key:
      - qrev_id
      foreign_keys:
      - columns:
        - counterparty_ref
        ref_table: counterparty
        ref_columns:
        - counterparty_ref
      - columns:
        - fiscal_quarter
        ref_table: fiscal_calendar
        ref_columns:
        - fiscal_quarter
    - name: rating
      columns:
      - name: rating_id
        type: INTEGER
        description: Row identifier
      - name: counterparty_ref
        type: VARCHAR
        description: Counterparty
      - name: rated_on
        type: DATE
        description: Rating date
      - name: internal_grade
        type: VARCHAR
        description: Internal rating grade
      - name: agency_grade
        type: VARCHAR
        description: External agency grade where available
      primary_key:
      - rating_id
      foreign_keys:
      - columns:
        - counterparty_ref
        ref_table: counterparty
        ref_columns:
        - counterparty_ref
