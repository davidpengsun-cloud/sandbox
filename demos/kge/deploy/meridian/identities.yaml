# The Meridian deployment's principals, each bound to a role template of the client's pack (clients/meridian/pack.yaml,
# access.roles). The deployment owns identities; the pack never does (pack-contract.md §4.10). Every name is invented.
client: meridian
# The querying identity a command asks as when it names none (make eval, make agent, make ab; PRINCIPAL names another):
# analyst_enterprise, who reads all four units, as the golden answers assume.
asker: analyst_enterprise.meridian@example.com
principals:
  - {principal: analyst_retail.meridian@example.com, role: analyst_retail}
  - {principal: analyst_enterprise.meridian@example.com, role: analyst_enterprise}
  - {principal: finance_reporting.meridian@example.com, role: finance_reporting}
  - {principal: steward_glossary.meridian@example.com, role: steward_glossary}
  - {principal: business_team.meridian@example.com, role: business_team}
  - {principal: advisor_wealth.meridian@example.com, role: advisor_wealth}
  - {principal: admin.meridian@example.com, role: admin}
  - {principal: steward.meridian@example.com, role: steward}
  - {principal: pipeline_tagger.meridian@example.com, role: pipeline_tagger}
  - {principal: knowledge_engineer.meridian@example.com, role: knowledge_engineer}
