# The Thornbury deployment's principals, each bound to a role template of the client's pack (clients/thornbury/pack.yaml,
# access.roles). The deployment owns identities; the pack never does. Every name is invented.
client: thornbury
# The querying identity a command asks as when it names none (make eval, make agent, make ab; PRINCIPAL names another):
# actuary, who reads both units.
asker: actuary.thornbury@example.com
principals:
  - {principal: actuary.thornbury@example.com, role: actuary}
  - {principal: claims_steward.thornbury@example.com, role: claims_steward}
  - {principal: pipeline_tagger.thornbury@example.com, role: pipeline_tagger}
  - {principal: knowledge_engineer.thornbury@example.com, role: knowledge_engineer}
