# The demo's tests (make test, or pytest from this folder). Many copy the graph into a temporary folder of their own,
# and pytest's defaults keep every one until the run ends, and the last three runs besides. Here a passing test's folder
# is deleted as the test ends, and a failing one's is kept to look at, for the last run alone: a run that passes leaves
# nothing behind (tests/integration/test_fixes.py holds it).
[pytest]
addopts = --strict-markers
markers =
    unit: needs no built demo (make test-unit)
    integration: needs the built demo, make graph pipeline (make test-integration)
    e2e: drives the demo end to end (make test-e2e)
tmp_path_retention_policy = failed
tmp_path_retention_count = 1
