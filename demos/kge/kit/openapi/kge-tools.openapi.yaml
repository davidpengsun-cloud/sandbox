openapi: 3.0.3
info:
  title: Client ALTA
  version: dev
  description: Reference tool spec for an external agent calling a private KGE service. Send the KGE bearer token in X-KGE-Authorization.
servers:
- url: https://<KGE_SERVICE_URL>
paths:
  /context:
    post:
      tags:
      - 'external: knowledge'
      summary: Context Package
      description: 'The context package the reference agent''s prompt carries on one arm, control (graph off) or treatment (graph on),

        built by the context workflow (kge/services/ask/engine/context.py) as the caller, exactly as /agent builds it, as JSON (as_json). /agent''s

        sign-in rules and errors: a bad arm is a 400. Set compact=true for the structured context, sources, definitions

        and decisions, with only definitions in the prompt block and no SQL, traces, duplicate candidates or plan internals.

        Omitted or false is unchanged.'
      operationId: context_package_context_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ContextAsk'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ContextResponse'
        '400':
          description: A run config or an arm that cannot run here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problems'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - name: X-KGE-Authorization
        in: header
        description: KGE sign-in, as `Bearer <token>`. On a private Cloud Run service the Google identity token is a separate header (`X-Serverless-Authorization`) and does not replace this one.
        required: true
        schema:
          type: string
  /ask:
    post:
      tags:
      - 'external: query'
      summary: Ask
      description: 'The graph arm, answered whole: figures from the warehouse with the documents that back them.


        A question with one customer group, optional narrowing and measures over it

        is planned, gated and cited here (kge/services/ask/engine/combined.py); any other question gets

        exactly what /answer returns, with combined: false. With no stages override

        the model takes part wherever it can if one is configured, as before. Every answer carries answer_text, worded

        by the template, or by the model where it phrases a combined answer and its wording passes the checks.

        Set background=true in the query string to return a durable run id (202) and follow /ask/runs/{id}.

        Set compact=true to omit SQL, traces, plan internals and duplicate candidates, keeping answer content,

        runtime labels and the history needed for follow-up turns. Omitted or false leaves the full response unchanged.'
      operationId: ask_ask_post
      parameters:
      - name: display
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Display
      - name: background
        in: query
        required: false
        schema:
          type: boolean
          default: false
          title: Background
      - name: X-KGE-Authorization
        in: header
        description: KGE sign-in, as `Bearer <token>`. On a private Cloud Run service the Google identity token is a separate header (`X-Serverless-Authorization`) and does not replace this one.
        required: true
        schema:
          type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Ask'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AskResponse'
        '400':
          description: A run config or an arm that cannot run here
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Problems'
        '202':
          description: A background question run
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /ask/runs/{run_id}:
    get:
      tags:
      - 'external: query'
      summary: Question Run
      description: Resume the signed-in person's question by id, as JSON or reconnectable live events.
      operationId: question_run_ask_runs__run_id__get
      parameters:
      - name: run_id
        in: path
        required: true
        schema:
          type: string
          title: Run Id
      - name: after
        in: query
        required: false
        schema:
          type: integer
          minimum: 0
          default: 0
          title: After
      - name: X-KGE-Authorization
        in: header
        description: KGE sign-in, as `Bearer <token>`. On a private Cloud Run service the Google identity token is a separate header (`X-Serverless-Authorization`) and does not replace this one.
        required: true
        schema:
          type: string
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRunResponse'
        '202':
          description: The background question is still running
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/QuestionRunResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /search:
    post:
      tags:
      - 'external: knowledge'
      summary: Search
      description: Rank products, terms, metrics, columns and documents the signed-in person may read, with the reason for each match.
      operationId: search_search_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/Search'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SearchResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - name: X-KGE-Authorization
        in: header
        description: KGE sign-in, as `Bearer <token>`. On a private Cloud Run service the Google identity token is a separate header (`X-Serverless-Authorization`) and does not replace this one.
        required: true
        schema:
          type: string
  /data/query:
    post:
      tags:
      - 'external: query'
      summary: Query
      description: 'Run the signed-in person''s read-only SQL against one readable unit, returning at most 1,000 rows.


        The SQL gate allows the query only when every rule below holds. It is within the complexity limit:

        32,768 characters, 4,096 tokens, 128 OR or UNION terms, 32 parenthesis levels and 192 syntax-tree

        levels, checked within 5 seconds. One statement, and it reads:

        SELECT or WITH ... SELECT, nothing that writes. A second statement is refused. Every table is in

        this unit''s warehouse. A CTE or subquery may not borrow a warehouse table''s name, and a source may

        not rename its columns by position. Name every column: SELECT * is refused, as are COLUMNS(...) and

        #n, and a whole row. Each named column must be on the unit''s allowlist. Restricted personal data is

        refused. Joins are inner joins only. JOIN ON is a conjunction (AND) of one column equal to another

        (table.column = table.column): OR, a constant or any other expression in ON is refused. Two tables

        meet only on a declared join, and a composite declared join needs every column pair together. A

        declared join that carries conditions of its own is used with those conditions, including its version

        window. Server-information functions and memory-expanding functions are refused. The warehouse then

        dry-runs the query and runs it only when that plan is accepted.'
      operationId: query_data_query_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/OwnQuery'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/kge__services__data__engine__models__RowsResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      parameters:
      - name: X-KGE-Authorization
        in: header
        description: KGE sign-in, as `Bearer <token>`. On a private Cloud Run service the Google identity token is a separate header (`X-Serverless-Authorization`) and does not replace this one.
        required: true
        schema:
          type: string
components:
  schemas:
    Arithmetic:
      properties:
        kind:
          type: string
          enum:
          - ratio
          - percent_change
          - difference
          title: Kind
        id:
          type: string
          minLength: 1
          title: Id
        numerator:
          type: string
          minLength: 1
          title: Numerator
        denominator:
          type: string
          minLength: 1
          title: Denominator
        evidence:
          items:
            $ref: '#/components/schemas/Span'
          type: array
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      - numerator
      - denominator
      - evidence
      title: Arithmetic
    Ask:
      properties:
        question:
          type: string
          maxLength: 2000
          title: Question
        purpose:
          type: string
          maxLength: 2000
          title: Purpose
          default: analysis
        arm:
          type: string
          title: Arm
          default: graph
        stages:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/kge__services__ask__models__Stages'
        compact:
          type: boolean
          title: Compact
          description: Opt in to answer, figures, definitions, citations and action metadata without SQL, traces or duplicate plans. History stays intact for follow-up turns.
          default: false
        history:
          items:
            $ref: '#/components/schemas/HistoryEntry-Input'
          type: array
          maxItems: 8
          title: History
        products:
          items:
            type: string
          type: array
          nullable: true
          title: Products
          description: Optional product identifiers (<unit>.<table>) supplying default page or Explore context; readable sources outside it remain available.
        runtimes:
          items:
            type: string
          type: array
          maxItems: 16
          nullable: true
          title: Runtimes
          description: Optional ordered runtime ids to try for this request.
      additionalProperties: false
      type: object
      required:
      - question
      title: Ask
      description: 'A question for /ask or /answer. Never a principal: the caller is who asks (a 422 for one in the body).'
    AskResponse:
      properties:
        question:
          type: string
          title: Question
        principal:
          type: string
          title: Principal
        purpose:
          type: string
          title: Purpose
        arm:
          type: string
          title: Arm
          description: The run config the answer ran on, as its label
        behaviour:
          type: string
          enum:
          - clarify
          - combined
          - figure
          - sum_with_verdict
          - sum_without_verdict
          - parts_with_reason
          - cite
          - cite_certified
          - glossary_definition
          - refuse
          - blocked_access
          - abstain
          - abstain_route_steward
          - abstain_with_reason
          title: Behaviour
          description: 'What the answer is. combined: figures planned and answered whole with their documents (/ask). figure: one figure, or grouped rows. sum_with_verdict, sum_without_verdict, parts_with_reason: parts across units, added only where they add. cite, cite_certified, glossary_definition: a definition and what it cites. refuse, blocked_access: a refusal, with its reason. abstain, abstain_route_steward, abstain_with_reason: no answer, with what is missing. clarify: readable choices, without a figure'
        answer_text:
          type: string
          title: Answer Text
          description: 'The answer in plain English, for every behaviour: a figure''s value, currency, term or column, period and [n] markers; a refusal''s what and why and whom to ask, by role; an abstention''s what is missing. Every number in it is one the answer holds and every [n] one of its citations'
        phrased_by:
          type: string
          title: Phrased By
          description: 'Who worded answer_text: template, or model:<provider:model> where a model''s wording passed the number and citation checks; template (<why>) where it did not'
        trace:
          items: {}
          type: array
          nullable: true
          title: Trace
          description: The answer steps, omitted in compact mode
        versions:
          additionalProperties: true
          type: object
          title: Versions
          description: The parser, planner, models and graph the answer ran on
        run_trace:
          additionalProperties: true
          type: object
          nullable: true
          title: Run Trace
          description: The run diagnostics, omitted in compact mode
        result:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Result'
        clarification:
          nullable: true
          allOf:
          - $ref: '#/components/schemas/Clarification'
        history:
          items:
            $ref: '#/components/schemas/HistoryEntry-Output'
          type: array
          nullable: true
          title: History
        figure:
          title: Figure
          description: The figure, or the total of a sum
          anyOf:
          - type: integer
          - type: number
          nullable: true
        unit:
          type: string
          nullable: true
          title: Unit
          description: The unit the figure is in
        column:
          type: string
          nullable: true
          title: Column
          description: The certified column it measures, table.column
        sql:
          type: string
          nullable: true
          title: Sql
          description: The query that gave it, after the gate passed it
        rows:
          additionalProperties:
            anyOf:
            - type: integer
            - type: number
            nullable: true
          type: object
          nullable: true
          title: Rows
          description: A grouped figure's rows, by group
        parts:
          title: Parts
          description: 'Across units: each unit''s value (a sum''s), or each unit''s plan (a refusal''s)'
          anyOf:
          - additionalProperties:
              anyOf:
              - type: integer
              - type: number
              nullable: true
            type: object
          - items: {}
            type: array
          nullable: true
        reason:
          type: string
          nullable: true
          title: Reason
          description: Why it refused or abstained, or what a sum's verdict rests on
        definition_citation:
          additionalProperties: true
          type: object
          nullable: true
          title: Definition Citation
          description: Certified pack glossary authority and context provenance for a context-backed definition with no defining document
        certified_definitions:
          items:
            additionalProperties: true
            type: object
          type: array
          nullable: true
          title: Certified Definitions
          description: Accepted pack definitions quoted verbatim with access redactions for the certified terms the answer explains, with their certifying documents
        cite:
          items:
            type: string
          type: array
          nullable: true
          title: Cite
          description: The documents a definition cites, by id
        citations:
          items:
            $ref: '#/components/schemas/Citation'
          type: array
          nullable: true
          title: Citations
          description: The documents the answer cites, numbered
        answer:
          type: string
          enum:
          - 'no'
          nullable: true
          title: Answer
          description: 'The answer to a question that asks whether two units join on a key''s name: "no", the graph''s no-join fact the reason. Absent on every other answer'
        denied_warehouses:
          items:
            type: string
          type: array
          nullable: true
          title: Denied Warehouses
          description: The units the caller may not read that it needs
        joins_refused:
          items:
            type: string
          type: array
          nullable: true
          title: Joins Refused
          description: The unit pairs a no-join fact keeps apart
        display:
          additionalProperties: true
          type: object
          nullable: true
          title: Display
          description: The page's display block, only where the request asks for it (its display query parameter)
        reference_sql:
          type: string
          nullable: true
          title: Reference Sql
          description: The reference plan's SQL before runtime renaming
        runtime:
          additionalProperties: true
          type: object
          nullable: true
          title: Runtime
          description: The runtime that executed the query
        physical_tables:
          items:
            type: string
          type: array
          nullable: true
          title: Physical Tables
          description: The physical tables the runtime read
        runtime_certified:
          type: boolean
          nullable: true
          title: Runtime Certified
          description: Whether the measure came from its certified runtime
        certified_in:
          type: string
          nullable: true
          title: Certified In
          description: The runtime the measure is certified in
        live_data:
          type: boolean
          nullable: true
          title: Live Data
          description: Whether the answer came from an external live runtime
        queried_at:
          type: string
          nullable: true
          title: Queried At
          description: UTC timestamp when an external runtime executed the query
        path:
          additionalProperties: true
          type: object
          nullable: true
          title: Path
          description: Structured query path (nodes and edges), omitted in compact mode
        graph_path:
          additionalProperties: true
          type: object
          nullable: true
          title: Graph Path
          description: The context graph's nodes and edges this answer used (graph_path), omitted in compact mode
        products:
          items:
            type: string
          type: array
          nullable: true
          title: Products
          description: Product identifiers (<unit>.<table>) supplying the question’s page or Explore context, when provided.
        combined:
          type: boolean
          title: Combined
          description: Whether /ask planned and answered it whole, figures with their documents
        figures:
          items:
            $ref: '#/components/schemas/Figure'
          type: array
          nullable: true
          title: Figures
          description: A combined answer's figures, each bound to its citation
        not_cited:
          items:
            $ref: '#/components/schemas/NotCited'
          type: array
          nullable: true
          title: Not Cited
          description: A combined answer's documents shown and not used
        withheld:
          items:
            $ref: '#/components/schemas/Withheld'
          type: array
          nullable: true
          title: Withheld
          description: A combined answer's documents the privacy gate held back
        unit_label:
          type: string
          nullable: true
          title: Unit Label
        period:
          type: string
          nullable: true
          title: Period
          description: A combined answer's period, in words
      additionalProperties: true
      type: object
      required:
      - question
      - principal
      - purpose
      - arm
      - behaviour
      - answer_text
      - phrased_by
      - versions
      - combined
      title: AskResponse
      description: 'POST /ask: the graph arm answered whole, figures with the documents that back them. A question of one customer

        group and measures over it is planned and cited whole (combined: true, with figures, citations, not_cited and

        withheld); any other gets /answer''s answer, with combined: false.'
    Binding:
      properties:
        release_identity:
          type: string
          title: Release Identity
        access_fingerprint:
          type: string
          title: Access Fingerprint
        products:
          items:
            type: string
          type: array
          title: Products
        purpose:
          type: string
          title: Purpose
      additionalProperties: false
      type: object
      required:
      - release_identity
      - access_fingerprint
      - products
      - purpose
      title: Binding
    Boolean:
      properties:
        kind:
          type: string
          title: Kind
          enum:
          - boolean
        value:
          type: boolean
          title: Value
      additionalProperties: false
      type: object
      required:
      - kind
      - value
      title: Boolean
    BoundDimension:
      properties:
        kind:
          type: string
          enum:
          - column
          - hierarchy
          title: Kind
        id:
          type: string
          minLength: 1
          title: Id
        bindings:
          items:
            $ref: '#/components/schemas/DimensionBinding'
          type: array
          minItems: 1
          title: Bindings
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      - bindings
      title: BoundDimension
    Cell:
      properties:
        value:
          oneOf:
          - $ref: '#/components/schemas/Text'
          - $ref: '#/components/schemas/Boolean'
          - $ref: '#/components/schemas/Integer'
          - $ref: '#/components/schemas/DecimalValue'
          - $ref: '#/components/schemas/DateValue'
          - $ref: '#/components/schemas/Null'
          title: Value
          discriminator:
            propertyName: kind
            mapping:
              boolean: '#/components/schemas/Boolean'
              date: '#/components/schemas/DateValue'
              decimal: '#/components/schemas/DecimalValue'
              integer: '#/components/schemas/Integer'
              'null': '#/components/schemas/Null'
              text: '#/components/schemas/Text'
        citations:
          items:
            type: string
          type: array
          title: Citations
        null_reasons:
          items:
            type: string
          type: array
          title: Null Reasons
      additionalProperties: false
      type: object
      required:
      - value
      - citations
      - null_reasons
      title: Cell
    Choice:
      properties:
        id:
          type: string
          minLength: 1
          title: Id
        label:
          type: string
          title: Label
      additionalProperties: false
      type: object
      required:
      - id
      - label
      title: Choice
    Citation:
      properties:
        n:
          type: integer
          title: N
          description: 'Its marker: [n] in answer_text'
        doc:
          type: string
          title: Doc
        title:
          type: string
          title: Title
          default: ''
        why:
          type: string
          title: Why
          default: ''
      additionalProperties: true
      type: object
      required:
      - n
      - doc
      title: Citation
      description: 'A document the answer cites: its marker n, as [n] in answer_text, and why it is cited. The tier rule adds its tier,

        how it is cited, its owner, version and time in force.'
    Clarification:
      properties:
        spans:
          items:
            $ref: '#/components/schemas/Span'
          type: array
          title: Spans
        slot:
          type: string
          minLength: 1
          title: Slot
        choices:
          items:
            $ref: '#/components/schemas/Choice'
          type: array
          title: Choices
      additionalProperties: false
      type: object
      required:
      - spans
      - slot
      - choices
      title: Clarification
    ColumnOperand:
      properties:
        kind:
          type: string
          title: Kind
          enum:
          - column
        name:
          $ref: '#/components/schemas/Name'
        path:
          items:
            $ref: '#/components/schemas/Name'
          type: array
          title: Path
      additionalProperties: false
      type: object
      required:
      - kind
      - name
      - path
      title: ColumnOperand
    Compare:
      properties:
        kind:
          type: string
          title: Kind
          enum:
          - compare
        id:
          type: string
          minLength: 1
          title: Id
        left:
          oneOf:
          - $ref: '#/components/schemas/ColumnOperand'
          - $ref: '#/components/schemas/OutputOperand'
          title: Left
          discriminator:
            propertyName: kind
            mapping:
              column: '#/components/schemas/ColumnOperand'
              output: '#/components/schemas/OutputOperand'
        op:
          type: string
          enum:
          - eq
          - ne
          - lt
          - le
          - gt
          - ge
          title: Op
        value:
          oneOf:
          - $ref: '#/components/schemas/Text'
          - $ref: '#/components/schemas/Boolean'
          - $ref: '#/components/schemas/Integer'
          - $ref: '#/components/schemas/DecimalValue'
          - $ref: '#/components/schemas/DateValue'
          - $ref: '#/components/schemas/Null'
          title: Value
          discriminator:
            propertyName: kind
            mapping:
              boolean: '#/components/schemas/Boolean'
              date: '#/components/schemas/DateValue'
              decimal: '#/components/schemas/DecimalValue'
              integer: '#/components/schemas/Integer'
              'null': '#/components/schemas/Null'
              text: '#/components/schemas/Text'
        evidence:
          items:
            $ref: '#/components/schemas/Span'
          type: array
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      - left
      - op
      - value
      - evidence
      title: Compare
    ContextAsk:
      properties:
        question:
          type: string
          maxLength: 2000
          title: Question
        purpose:
          type: string
          maxLength: 2000
          title: Purpose
          default: analysis
        arm:
          type: string
          title: Arm
          default: treatment
        products:
          items:
            type: string
          type: array
          nullable: true
          title: Products
        plan_vocabulary:
          type: boolean
          title: Plan Vocabulary
          default: false
        compact:
          type: boolean
          title: Compact
          description: Opt in to structured context, definitions, sources and decisions with definition text only in the prompt block, without SQL, traces, duplicate candidates or plan internals.
          default: false
        history:
          items:
            $ref: '#/components/schemas/HistoryEntry-Input'
          type: array
          maxItems: 8
          title: History
        runtimes:
          items:
            type: string
          type: array
          maxItems: 16
          nullable: true
          title: Runtimes
      additionalProperties: false
      type: object
      required:
      - question
      title: ContextAsk
    ContextComparison:
      properties:
        kind:
          type: string
          title: Kind
          enum:
          - contexts
        id:
          type: string
          minLength: 1
          title: Id
        left:
          type: string
          minLength: 1
          title: Left
        right:
          type: string
          minLength: 1
          title: Right
        evidence:
          items:
            $ref: '#/components/schemas/Span'
          type: array
          title: Evidence
      additionalProperties: false
      type: object
      required:
      - kind
      - id
      - left
      - right
      - evidence
      title: ContextComparison
    ContextResponse:
      properties:
        arm:
          type: string
          title: Arm
          description: control (graph off) or treatment (graph on)
        block:
          type: string
          title: Block
