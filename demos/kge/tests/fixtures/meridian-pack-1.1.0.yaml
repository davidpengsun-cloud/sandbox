# -- 1.1.0: the query semantics of the Wealth expansion (meta-model 1.1.0) -------------------------------------------------
# What a figure the Wealth terms name is built of, as data: a term resolves to its contexts; a context names its measure
# and fact table, the filters and row selectors it always applies, and the declared joins it renders, always or to reach a
# dimension. A runtime builds the query from these, not from the question's words.

# Short forms: of a term, or as the physical columns' names would spell them (the cryptic spellings a question may use).
acronyms:
  - {id: NNA, expansion: Net New Assets, terms: [net-new-assets]}
  - {id: AUA, expansion: Assets Under Advice, terms: [assets-under-advice]}
  - {id: NNA_ELIG_FLG, expansion: NNA eligible flag, terms: [nna-eligibility], columns: [wealth.flow.nna_eligible_flag]}
  - id: SRC_SYS_CD
    expansion: source system code
    terms: [source-system]
    columns: [wealth.account.source_system, wealth.flow.source_system, wealth.nna_exclusion.source_system,
              wealth.ref_source_system.source_system, xref.client_xref.source_system]
  - {id: CLNT_DIR_IND, expansion: client-directed indicator, columns: [wealth.flow.is_client_directed]}

# Business entities and the key a table identifies each by: each unit's customer, by its customer-like key, and the
# Wealth account, by its composite key (an account number is unique only within its source system).
entities:
  - {id: retail_customer, label: Retail customer, table: retail.customer, key: [customer_id]}
  - {id: sme_client, label: SME client, table: sme.client, key: [client_no]}
  - {id: corporate_counterparty, label: Corporate counterparty, table: corporate.counterparty, key: [counterparty_ref]}
  - {id: wealth_household, label: Wealth household, table: wealth.household, key: [household_id]}
  - {id: wealth_account, label: Wealth account, table: wealth.account, key: [account_id, source_system]}

# The relation the certified cross-reference implements (joins: client_xref).
relations:
  - {id: same_client, label: Same client, from: retail_customer, to: wealth_household}

# Lineage: assets under management at each quarter end is the households' holdings at market value, summed.
lineage:
  - table: wealth.aum_month_end
    derived_from: [wealth.holding]
    note: the market value of each household's holdings, summed at each quarter end

# Standing conditions on one table's rows. eligible conflicts with not_excluded: a flow can be eligible and its account
# excluded on the day, and then the exclusion wins.
filters:
  - {id: eligible, label: Eligible for net new assets, table: wealth.flow, predicate: flow.nna_eligible_flag, conflicts_with: [not_excluded]}
  - {id: released, label: Released months only, table: wealth.month_end, predicate: month_end.is_released}
  - {id: client_directed, label: Flows the client instructed, table: wealth.flow, predicate: flow.is_client_directed}

# A fact row is left out when a row of the selector's table matches it (NOT EXISTS): a test account's flows, and the flows
# of an account excluded on the flow's date (the exclusion is effective-dated; an open one has no end).
row_selectors:
  - id: not_test_account
    label: Not on a test account
    table: wealth.account
    mode: exclude
    predicate: >-
      account.account_id = flow.account_id AND account.source_system = flow.source_system AND account.is_test_account
  - id: not_excluded
    label: Not on an account excluded on the day
    table: wealth.nna_exclusion
    mode: exclude
    predicate: >-
      nna_exclusion.account_id = flow.account_id AND nna_exclusion.source_system = flow.source_system AND flow.flow_date
      BETWEEN nna_exclusion.effective_from AND coalesce(nna_exclusion.effective_to, DATE '9999-12-31')
    conflicts_with: [eligible]

# Typed, declared joins: what the context path joins through, and nothing else. A table that keeps its history (policies:
# scd2) is joined as its version current now, or valid on the date the question's time mode gives (as reported: the
# month's freeze date); that rendering is the runtime's, from the policy. A foreign key harvested from a catalogue is only
# a candidate for one (the compiler lists those no join here covers).
joins:
  - {id: flow_month_end, kind: calendar_rollup, from: wealth.flow, to: wealth.month_end,
     condition: last_day(flow.flow_date) = month_end.month_end_date}
  - {id: flow_account, kind: key, from: wealth.flow, to: wealth.account,
     condition: flow.account_id = account.account_id AND flow.source_system = account.source_system}
  - {id: account_household, kind: key, from: wealth.account, to: wealth.household, condition: account.household_id = household.household_id}
  - {id: household_advisor, kind: key, from: wealth.household, to: wealth.advisor,
     condition: household.primary_advisor_id = advisor.advisor_id}
  - {id: advisor_office, kind: hierarchy, from: wealth.advisor, to: wealth.office, condition: advisor.office_code = office.office_code}
  - {id: office_region, kind: hierarchy, from: wealth.office, to: wealth.region, condition: office.region_code = region.region_code}
  - {id: region_division, kind: hierarchy, from: wealth.region, to: wealth.division, condition: region.division_code = division.division_code}
  - {id: account_segment, kind: key, from: wealth.account, to: wealth.client_segment,
     condition: account.segment_code = client_segment.segment_code}
  - {id: segment_parent, kind: hierarchy, from: wealth.client_segment, to: wealth.client_segment, alias: parent_segment,
     condition: client_segment.parent_segment_code = parent_segment.segment_code}
  # The certified client cross-reference (Option B): a Retail customer to the Wealth household of the member who is the
  # same client, through certified matches only. Never on a date of birth or an email: matching is upstream and offline.
  - id: client_xref
    kind: cross_reference
    from: retail.customer
    to: wealth.household
    through: xref.client_xref
    implements: same_client
    condition: >-
      retail.customer.customer_id = xref.client_xref.retail_customer_id AND xref.client_xref.household_id =
      wealth.household.household_id AND xref.client_xref.certification_status = 'CERTIFIED'

# The metric variants the Wealth terms resolve to. joins are always rendered; reaches are rendered only to group by a
# dimension or filter on an entity they lead to. golden names the golden questions that certify each, by id.
contexts:
  - id: nna
    label: Net new assets
    description: >-
      The amounts of eligible flows in released months, summed in USD, test accounts and accounts excluded on the
      flow's date left out.
    term: net-new-assets
    measure: wealth.net-new-assets
    fact: wealth.flow
    filters: [eligible, released]
    row_selectors: [not_test_account, not_excluded]
    joins: [flow_month_end]
    reaches: [flow_account, account_household, household_advisor, advisor_office, office_region, region_division,
              account_segment, segment_parent, client_xref]
    golden:
      set: golden_wealth
      items: [W01, W03, W04, W05, W06, W07, W09, W10, W12, W13, W14, W15, W18, XB3, XB4]
  - id: nna_client_directed
    label: Client-directed net new assets
    description: Net new assets from the flows the client instructed.
    term: client-directed-nna
    measure: wealth.net-new-assets
    fact: wealth.flow
    filters: [eligible, released, client_directed]
    row_selectors: [not_test_account, not_excluded]
    joins: [flow_month_end]
    reaches: [flow_account, account_household, household_advisor, advisor_office, office_region, region_division,
              account_segment, segment_parent, client_xref]
    golden:
      set: golden_wealth
      items: [W02]

policies:
  # Personal data of customers is Restricted by default (POL-DATA-CLASS). No query the assistant plans or a model writes
  # may read these columns, in any arm: the SQL gate refuses them by name.
  restricted_attributes:
    - id: restricted-personal-data
      action: refuse
      cite: POL-DATA-CLASS
      version: 1.0.0   # unchanged since the pack that declared it
      columns:
        - retail.customer.first_name
        - retail.customer.last_name
        - retail.customer.date_of_birth
        - retail.customer.email
        - corporate.contact.contact_name
        - corporate.contact.contact_email
        - wealth.household.household_name
  # Time semantics (1.1.0). A table that keeps its history: each version holds from valid_from to valid_to, the last
  # day it holds (null while it is current), and is_current marks the version that holds now.
  scd2:
    - {id: scd2-wealth-account, table: wealth.account, valid_from: valid_from, valid_to: valid_to, is_current: is_current, valid_to_inclusive: true}
    - {id: scd2-wealth-flow, table: wealth.flow, valid_from: valid_from, valid_to: valid_to, is_current: is_current, valid_to_inclusive: true}
    - {id: scd2-wealth-office, table: wealth.office, valid_from: valid_from, valid_to: valid_to, is_current: is_current, valid_to_inclusive: true}
    - {id: scd2-wealth-region, table: wealth.region, valid_from: valid_from, valid_to: valid_to, is_current: is_current, valid_to_inclusive: true}
    - {id: scd2-wealth-division, table: wealth.division, valid_from: valid_from, valid_to: valid_to, is_current: is_current,
       valid_to_inclusive: true}
    - {id: scd2-xref-client-xref, table: xref.client_xref, valid_from: valid_from, valid_to: valid_to, is_current: is_current,
       valid_to_inclusive: true}
  # When each month was frozen and released: only a released month is reported, and the latest month is the latest
  # released; a month as reported is its rows valid on its freeze date.
  release_driver:
    - {id: wealth-month-end-release, table: wealth.month_end, period: month_end_date, release_date: release_date,
       freeze_date: freeze_date, released: is_released}

# Who may read which unit, write which curated data, and perform which of the platform's processes, as role templates.
# The deployment binds its principals to them (deploy/meridian/identities.yaml); enforcement in the real estate is IAM
# and fine-grained access control, and the graph carries a query-time mirror. reads: all is every source. label is
# the role's title, which a principal bound to it carries in the graph.
access:
  # The purposes a chunk may be retrieved for. The same artefact can be eligible for supervision and prohibited for
  # the assistant: that is the purpose-bound gate.
  purposes: [analysis, assistant, supervision]
  roles:
    - {id: analyst_retail, label: Analyst, reads: [retail], processes: [querying]}
    - {id: analyst_enterprise, label: Analyst, reads: all, processes: [querying]}
    - {id: finance_reporting, label: Finance, reads: all, processes: [querying]}
    - {id: steward_glossary, label: Steward, reads: all, writes: [mappings, terms], processes: [certification, querying]}
    - {id: advisor_wealth, label: Advisor, reads: [wealth], processes: [querying]}
    # The pair for the join-time access rule (Graph.join_access): a cross-warehouse combination proceeds only if the
    # requester can read every warehouse in it. admin is the baseline: it reads all four and may do all three
    # processes. steward reads the two personal-customer units only, so it can combine Retail with Wealth but is
    # blocked from any combination that touches SME or Corporate. It certifies and queries; it does not tag.
    - {id: admin, label: Admin, reads: all, writes: [mappings, terms], processes: [tagging, certification, querying]}
    - {id: steward, label: Steward, reads: [retail, wealth], writes: [mappings, terms], processes: [certification, querying]}
    # The pipeline's own role. It reads documents, not warehouses, and may only tag: it cannot answer questions or
    # decide anything in the queue.
    - {id: pipeline_tagger, label: Pipeline, reads: [], processes: [tagging]}

# The question sets the A/B runs are scored on, by name and version. They are generated beside the estate
# (build/<name>.json) and not restated here, so the baselines stay comparable. Golden v2 is v1 with retail-wealth
# dropped from G021's and G030's refused joins (the certified client cross-reference, issue #39's Option B), and its
# file declares that change, so a run on v2 is still put beside the baseline on v1. golden_wealth v1, the owner's Wealth
# and cross-unit questions, is named by its items' ids alone, which the contexts' golden questions are among: its file,
# build/golden_wealth_v1.json, comes with the estate (estate/golden_wealth.py). Beside XB1 to XB6 it holds the refusals the
# owner names with them: XB1 asked as analyst_retail and XB3 as advisor_wealth, a match on a date of birth, and a
# question across the units that asks for an email.
tests:
  sets:
    - {name: golden, version: v2}
    - {name: heldout, version: v1}
    - name: golden_wealth
      version: v1
      items: [W01, W02, W03, W04, W05, W06, W07, W08, W09, W10, W11, W12, W13, W14, W15, W16, W17, W18, W19, W20,
              XB1, XB2, XB3, XB4, XB5, XB6, XB1-R, XB3-W, XB-DOB, XB-EMAIL]
